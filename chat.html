<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta name="theme-color" content="#030305">

<title>FLASH — Chat</title>


<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {

    background: #030305;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =====================================================
   APP
===================================================== */

.app {

    width: 100%;
    height: 100dvh;

    display: flex;

    position: relative;

    overflow: hidden;

    background:

        radial-gradient(
            circle at 50% 40%,
            rgba(70,55,160,.10),
            transparent 40%
        ),

        #030305;
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar {

    width: 270px;

    height: 100%;

    flex-shrink: 0;

    background:
        rgba(7,7,13,.96);

    border-right:
        1px solid
        rgba(255,255,255,.07);

    display:
        flex;

    flex-direction:
        column;

    z-index: 30;

    transition:
        transform .25s ease;
}


/* =====================================================
   SIDEBAR HEADER
===================================================== */

.sidebar-header {

    height: 65px;

    display:
        flex;

    align-items:
        center;

    padding:
        0 17px;

    border-bottom:
        1px solid
        rgba(255,255,255,.06);
}


.flash-logo {

    display:
        flex;

    align-items:
        center;

    gap:
        10px;
}


.flash-icon {

    width:
        35px;

    height:
        35px;

    border-radius:
        10px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    background:

        radial-gradient(
            circle,
            #000 0 30%,
            transparent 32%
        ),

        conic-gradient(
            #5649d8,
            #bd68ff,
            #5c91ff,
            #5649d8
        );

    box-shadow:
        0 0 20px
        rgba(100,80,255,.3);
}


.flash-name {

    font-size:
        19px;

    font-weight:
        900;
}


.flash-version {

    margin-top:
        2px;

    font-family:
        monospace;

    font-size:
        7px;

    color:
        rgba(255,255,255,.3);

    letter-spacing:
        1px;
}


/* =====================================================
   CHANNEL TITLE
===================================================== */

.channels-title {

    padding:
        20px 17px 8px;

    font-family:
        monospace;

    font-size:
        8px;

    color:
        rgba(255,255,255,.3);

    letter-spacing:
        1.5px;
}


/* =====================================================
   CHANNELS
===================================================== */

.channels {

    display:
        flex;

    flex-direction:
        column;

    gap:
        3px;

    padding:
        0 9px;
}


.channel {

    width:
        100%;

    min-height:
        42px;

    padding:
        0 11px;

    display:
        flex;

    align-items:
        center;

    gap:
        9px;

    border:
        0;

    border-radius:
        8px;

    background:
        transparent;

    color:
        rgba(255,255,255,.42);

    font-size:
        13px;

    text-align:
        left;

    cursor:
        pointer;

    transition:
        .15s;
}


.channel:hover {

    background:
        rgba(255,255,255,.04);

    color:
        white;
}


.channel.active {

    background:
        rgba(105,90,230,.16);

    color:
        white;

}


.channel-icon {

    color:
        rgba(255,255,255,.25);

    font-size:
        18px;
}


.channel.active
.channel-icon {

    color:
        #9588ff;
}


/* =====================================================
   SIDEBAR BOTTOM
===================================================== */

.sidebar-bottom {

    margin-top:
        auto;

    padding:
        10px;

    border-top:
        1px solid
        rgba(255,255,255,.06);
}


/* =====================================================
   USER CARD
===================================================== */

.user-card {

    width:
        100%;

    padding:
        9px;

    border-radius:
        10px;

    display:
        flex;

    align-items:
        center;

    gap:
        9px;

    background:
        rgba(255,255,255,.035);

    cursor:
        pointer;
}


.avatar {

    width:
        34px;

    height:
        34px;

    flex-shrink:
        0;

    border-radius:
        50%;

    background:
        #191925;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    overflow:
        hidden;

    font-size:
        15px;
}


.avatar img {

    width:
        100%;

    height:
        100%;

    object-fit:
        cover;
}


.user-name {

    overflow:
        hidden;

    white-space:
        nowrap;

    text-overflow:
        ellipsis;

    font-size:
        12px;

    font-weight:
        bold;
}


.user-status {

    margin-top:
        2px;

    color:
        rgba(255,255,255,.3);

    font-family:
        monospace;

    font-size:
        7px;
}


/* =====================================================
   MAIN CHAT
===================================================== */

.chat {

    min-width:
        0;

    flex:
        1;

    height:
        100%;

    display:
        flex;

    flex-direction:
        column;

    position:
        relative;
}


/* =====================================================
   CHAT HEADER
===================================================== */

.chat-header {

    height:
        65px;

    min-height:
        65px;

    display:
        flex;

    align-items:
        center;

    gap:
        12px;

    padding:
        0 15px;

    border-bottom:
        1px solid
        rgba(255,255,255,.06);

    background:
        rgba(5,5,10,.72);

    backdrop-filter:
        blur(15px);

    -webkit-backdrop-filter:
        blur(15px);

    z-index:
        10;
}


/* =====================================================
   MENU BUTTON
===================================================== */

.menu-button {

    width:
        40px;

    height:
        40px;

    display:
        none;

    align-items:
        center;

    justify-content:
        center;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:
        10px;

    background:
        rgba(255,255,255,.035);

    color:
        white;

    font-size:
        20px;

    cursor:
        pointer;
}


.channel-heading {

    min-width:
        0;
}


.channel-name {

    font-size:
        15px;

    font-weight:
        bold;
}


.channel-description {

    margin-top:
        3px;

    color:
        rgba(255,255,255,.3);

    font-family:
        monospace;

    font-size:
        7px;

    letter-spacing:
        .7px;
}


/* =====================================================
   MESSAGES
===================================================== */

.messages {

    flex:
        1;

    min-height:
        0;

    overflow-y:
        auto;

    padding:
        18px 16px 12px;

    scroll-behavior:
        smooth;
}


.messages::-webkit-scrollbar {

    width:
        5px;
}


.messages::-webkit-scrollbar-thumb {

    background:
        rgba(255,255,255,.1);

    border-radius:
        10px;
}


/* =====================================================
   WELCOME
===================================================== */

.welcome {

    padding:
        15px 0 25px;

    border-bottom:
        1px solid
        rgba(255,255,255,.06);

    margin-bottom:
        15px;
}


.welcome-icon {

    width:
        48px;

    height:
        48px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border-radius:
        14px;

    background:
        rgba(100,85,255,.12);

    border:
        1px solid
        rgba(130,115,255,.2);

    font-size:
        22px;

    margin-bottom:
        12px;
}


.welcome h1 {

    font-size:
        22px;

    margin-bottom:
        6px;
}


.welcome p {

    color:
        rgba(255,255,255,.35);

    font-size:
        12px;

    line-height:
        1.6;
}


/* =====================================================
   MESSAGE
===================================================== */

.message {

    display:
        flex;

    gap:
        10px;

    padding:
        8px 7px;

    border-radius:
        8px;

    transition:
        background .15s;
}


.message:hover {

    background:
        rgba(255,255,255,.025);
}


.message-avatar {

    width:
        36px;

    height:
        36px;

    flex-shrink:
        0;

    border-radius:
        50%;

    overflow:
        hidden;

    background:
        #191925;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;
}


.message-avatar img {

    width:
        100%;

    height:
        100%;

    object-fit:
        cover;
}


.message-content {

    min-width:
        0;

    flex:
        1;
}


.message-top {

    display:
        flex;

    align-items:
        baseline;

    gap:
        8px;

    flex-wrap:
        wrap;
}


.message-author {

    font-size:
        12px;

    font-weight:
        bold;
}


.creator-badge {

    display:
        inline-flex;

    align-items:
        center;

    justify-content:
        center;

    padding:
        2px 5px;

    border-radius:
        4px;

    background:
        rgba(130,110,255,.16);

    border:
        1px solid
        rgba(150,130,255,.25);

    color:
        #b5aaff;

    font-family:
        monospace;

    font-size:
        6px;

    letter-spacing:
        .5px;
}


.message-time {

    color:
        rgba(255,255,255,.2);

    font-family:
        monospace;

    font-size:
        7px;
}


.message-text {

    margin-top:
        4px;

    color:
        rgba(255,255,255,.72);

    font-size:
        13px;

    line-height:
        1.55;

    word-break:
        break-word;
}


.message-actions {

    display:
        none;

    margin-top:
        5px;

    gap:
        5px;
}


.message:hover
.message-actions {

    display:
        flex;
}


.message-delete {

    border:
        0;

    background:
        transparent;

    color:
        rgba(255,100,100,.6);

    font-family:
        monospace;

    font-size:
        8px;

    cursor:
        pointer;
}


/* =====================================================
   INPUT AREA
===================================================== */

.input-area {

    padding:
        10px 13px;

    padding-bottom:
        max(10px, env(safe-area-inset-bottom));

    background:
        linear-gradient(
            to top,
            #030305 70%,
            transparent
        );
}


.input-box {

    width:
        100%;

    min-height:
        48px;

    display:
        flex;

    align-items:
        center;

    gap:
        8px;

    padding:
        5px 7px 5px 14px;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:
        13px;

    background:
        rgba(12,12,20,.95);

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.25);
}


#messageInput {

    flex:
        1;

    min-width:
        0;

    height:
        36px;

    border:
        0;

    outline:
        none;

    resize:
        none;

    background:
        transparent;

    color:
        white;

    font-family:
        Arial,
        sans-serif;

    font-size:
        13px;

    line-height:
        36px;
}


#messageInput::placeholder {

    color:
        rgba(255,255,255,.22);
}


#sendButton {

    width:
        38px;

    height:
        38px;

    flex-shrink:
        0;

    border:
        0;

    border-radius:
        10px;

    background:
        #6355df;

    color:
        white;

    font-size:
        17px;

    cursor:
        pointer;
}


/* =====================================================
   OVERLAY
===================================================== */

.overlay {

    position:
        fixed;

    inset:
        0;

    background:
        rgba(0,0,0,.65);

    z-index:
        20;

    opacity:
        0;

    pointer-events:
        none;

    transition:
        opacity .25s;
}


/* =====================================================
   PROFILE PANEL
===================================================== */

.profile-panel {

    position:
        fixed;

    z-index:
        50;

    top:
        0;

    right:
        0;

    width:
        min(380px, 100%);

    height:
        100dvh;

    background:
        #08080f;

    border-left:
        1px solid
        rgba(255,255,255,.08);

    transform:
        translateX(100%);

    transition:
        transform .25s ease;

    display:
        flex;

    flex-direction:
        column;
}


.profile-panel.open {

    transform:
        translateX(0);
}


.profile-header {

    height:
        65px;

    min-height:
        65px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    padding:
        0 15px;

    border-bottom:
        1px solid
        rgba(255,255,255,.06);
}


.profile-title {

    font-family:
        monospace;

    font-size:
        10px;

    letter-spacing:
        1px;
}


.close-button {

    width:
        38px;

    height:
        38px;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:
        9px;

    background:
        rgba(255,255,255,.04);

    color:
        white;

    cursor:
        pointer;

    font-size:
        17px;
}


.profile-content {

    overflow-y:
        auto;

    padding:
        25px 18px;
}


.profile-avatar {

    width:
        90px;

    height:
        90px;

    margin:
        0 auto 14px;

    border-radius:
        50%;

    overflow:
        hidden;

    background:
        #191925;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    font-size:
        35px;

    border:
        2px solid
        rgba(140,120,255,.35);

    box-shadow:
        0 0 35px
        rgba(100,80,255,.15);
}


.profile-avatar img {

    width:
        100%;

    height:
        100%;

    object-fit:
        cover;
}


.profile-name {

    text-align:
        center;

    font-size:
        19px;

    font-weight:
        bold;
}


.profile-handle {

    margin-top:
        4px;

    text-align:
        center;

    color:
        rgba(255,255,255,.35);

    font-family:
        monospace;

    font-size:
        9px;
}


.profile-badge {

    width:
        max-content;

    margin:
        10px auto 25px;

    padding:
        5px 8px;

    border:
        1px solid
        rgba(150,130,255,.25);

    border-radius:
        6px;

    background:
        rgba(110,90,255,.1);

    color:
        #b5aaff;

    font-family:
        monospace;

    font-size:
        7px;

    letter-spacing:
        .8px;
}


/* =====================================================
   PROFILE FORMS
===================================================== */

.profile-section {

    margin-top:
        20px;
}


.profile-label {

    margin-bottom:
        7px;

    color:
        rgba(255,255,255,.35);

    font-family:
        monospace;

    font-size:
        8px;

    letter-spacing:
        1px;
}


.profile-section input {

    width:
        100%;

    height:
        44px;

    padding:
        0 12px;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:
        9px;

    outline:
        none;

    background:
        #040408;

    color:
        white;
}


.profile-button {

    width:
        100%;

    height:
        44px;

    margin-top:
        8px;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:
        9px;

    background:
        rgba(255,255,255,.04);

    color:
        white;

    font-family:
        monospace;

    font-size:
        8px;

    cursor:
        pointer;
}


.profile-button:hover {

    background:
        rgba(110,90,255,.13);
}


.danger {

    margin-top:
        30px;

    padding-top:
        20px;

    border-top:
        1px solid
        rgba(255,255,255,.06);
}


.delete-account {

    color:
        #ff7373;

    border-color:
        rgba(255,90,90,.15);

    background:
        rgba(255,70,70,.05);
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 800px) {

    .sidebar {

        position:
            fixed;

        top:
            0;

        left:
            0;

        width:
            min(285px, 86vw);

        transform:
            translateX(-100%);

        box-shadow:
            20px 0 60px
            rgba(0,0,0,.5);
    }


    .sidebar.open {

        transform:
            translateX(0);
    }


    .menu-button {

        display:
            flex;
    }


    .overlay.open {

        opacity:
            1;

        pointer-events:
            auto;
    }


    .chat-header {

        padding:
            0 10px;
    }


    .messages {

        padding:
            12px 10px 8px;
    }


    .message {

        padding:
            8px 3px;
    }


    .message-actions {

        display:
            flex;
    }


    .input-area {

        padding-left:
            8px;

        padding-right:
            8px;
    }

}


/* =====================================================
   VERY SMALL PHONES
===================================================== */

@media (max-width: 380px) {

    .channel-name {

        font-size:
            14px;
    }


    .message-text {

        font-size:
            12px;
    }


    .welcome h1 {

        font-size:
            19px;
    }

}

</style>

</head>


<body>


<div class="app">


    <!-- =================================================
         SIDEBAR
    ================================================= -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <div class="sidebar-header">

            <div class="flash-logo">

                <div class="flash-icon">
                    ⚡
                </div>

                <div>

                    <div class="flash-name">
                        FLASH
                    </div>

                    <div class="flash-version">
                        LOCAL INSTANCE · V0
                    </div>

                </div>

            </div>

        </div>


        <div class="channels-title">
            CHANNELS
        </div>


        <div
            class="channels"
            id="channels"
        >

            <button
                class="channel active"
                data-channel="general"
            >

                <span class="channel-icon">
                    #
                </span>

                général

            </button>


            <button
                class="channel"
                data-channel="random"
            >

                <span class="channel-icon">
                    #
                </span>

                random

            </button>


            <button
                class="channel"
                data-channel="gaming"
            >

                <span class="channel-icon">
                    #
                </span>

                gaming

            </button>


            <button
                class="channel"
                data-channel="music"
            >

                <span class="channel-i
