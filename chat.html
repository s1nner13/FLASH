<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>FLASH — Chat</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background: #020204;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

button,
input,
textarea {
    font: inherit;
}


/* =========================================================
   APP
========================================================= */

.app {
    width: 100%;
    height: 100dvh;

    display: flex;

    position: relative;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(91,72,190,.12),
            transparent 42%
        ),
        #020204;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {

    width: 275px;
    height: 100%;

    flex-shrink: 0;

    background: rgba(8,8,14,.98);

    border-right: 1px solid rgba(255,255,255,.07);

    display: flex;
    flex-direction: column;

    position: relative;

    z-index: 40;
}


/* =========================================================
   LOGO
========================================================= */

.logo-area {

    height: 70px;
    min-height: 70px;

    display: flex;
    align-items: center;

    padding: 12px 15px;

    border-bottom: 1px solid rgba(255,255,255,.06);
}

.logo-circle {

    width: 40px;
    height: 40px;

    border-radius: 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-right: 10px;

    background:
        radial-gradient(
            circle,
            #030305 0 25%,
            transparent 27%
        ),
        conic-gradient(
            #6254e7,
            #9a6cff,
            #4d7dff,
            #6254e7
        );

    box-shadow:
        0 0 25px rgba(91,76,240,.3);
}

.logo-text {
    font-size: 19px;
    font-weight: 900;
}

.logo-sub {
    margin-top: 3px;
    color: rgba(255,255,255,.25);
    font-size: 7px;
    font-family: monospace;
    letter-spacing: 1px;
}


/* =========================================================
   SERVER / CHANNEL AREA
========================================================= */

.section-title {

    padding: 18px 15px 7px;

    color: rgba(255,255,255,.25);

    font-family: monospace;

    font-size: 8px;

    letter-spacing: 1.5px;
}

.channels {

    padding: 0 8px;

    display: flex;
    flex-direction: column;

    gap: 3px;
}

.channel {

    width: 100%;
    min-height: 43px;

    border: 0;
    border-radius: 9px;

    padding: 0 12px;

    display: flex;
    align-items: center;

    gap: 10px;

    background: transparent;

    color: rgba(255,255,255,.43);

    text-align: left;

    cursor: pointer;
}

.channel:hover {
    background: rgba(255,255,255,.04);
    color: white;
}

.channel.active {

    background:
        linear-gradient(
            90deg,
            rgba(102,87,235,.22),
            rgba(102,87,235,.08)
        );

    color: white;
}

.channel-symbol {

    color: #8175e9;

    font-size: 17px;
}

.channel-name {
    font-size: 13px;
}


/* =========================================================
   SIDEBAR BOTTOM
========================================================= */

.sidebar-bottom {

    margin-top: auto;

    padding: 10px;

    border-top: 1px solid rgba(255,255,255,.06);
}

.user-card {

    min-height: 52px;

    border-radius: 11px;

    padding: 8px;

    display: flex;
    align-items: center;

    gap: 10px;

    background: rgba(255,255,255,.035);

    cursor: pointer;
}

.user-card:hover {
    background: rgba(255,255,255,.06);
}

.avatar {

    width: 36px;
    height: 36px;

    flex-shrink: 0;

    border-radius: 50%;

    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #181823;
}

.avatar img {

    width: 100%;
    height: 100%;

    object-fit: cover;
}

.user-name {

    max-width: 180px;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    font-size: 12px;
    font-weight: bold;
}

.user-status {

    margin-top: 3px;

    color: rgba(255,255,255,.25);

    font-size: 7px;

    font-family: monospace;
}


/* =========================================================
   CHAT
========================================================= */

.chat {

    flex: 1;

    min-width: 0;
    min-height: 0;

    height: 100%;

    display: flex;
    flex-direction: column;

    position: relative;
}


/* =========================================================
   HEADER
========================================================= */

.chat-header {

    height: 70px;
    min-height: 70px;

    display: flex;
    align-items: center;

    padding: 0 16px;

    border-bottom: 1px solid rgba(255,255,255,.06);

    background: rgba(5,5,9,.85);

    backdrop-filter: blur(18px);

    z-index: 10;
}

.menu-button {

    width: 42px;
    height: 42px;

    margin-right: 11px;

    display: none;

    align-items: center;
    justify-content: center;

    border: 1px solid rgba(255,255,255,.08);

    border-radius: 11px;

    background: rgba(255,255,255,.035);

    color: white;

    cursor: pointer;

    font-size: 19px;
}

.channel-info {
    min-width: 0;
}

.channel-title {

    font-size: 15px;
    font-weight: bold;
}

.channel-topic {

    margin-top: 4px;

    color: rgba(255,255,255,.27);

    font-family: monospace;

    font-size: 7px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =========================================================
   MEMBERS BUTTON
========================================================= */

.members-button {

    margin-left: auto;

    width: 42px;
    height: 42px;

    border: 1px solid rgba(255,255,255,.07);

    border-radius: 10px;

    background: rgba(255,255,255,.035);

    color: rgba(255,255,255,.65);

    cursor: pointer;
}


/* =========================================================
   MESSAGES
========================================================= */

.messages {

    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding: 18px 18px 12px;
}

.messages::-webkit-scrollbar {
    width: 5px;
}

.messages::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,.1);
    border-radius: 10px;
}


/* =========================================================
   WELCOME
========================================================= */

.welcome {

    padding: 15px 0 25px;

    margin-bottom: 14px;

    border-bottom: 1px solid rgba(255,255,255,.06);
}

.welcome-symbol {

    width: 48px;
    height: 48px;

    border-radius: 14px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(99,82,224,.13);

    border: 1px solid rgba(120,105,255,.2);

    color: #a096ff;

    font-size: 23px;

    margin-bottom: 12px;
}

.welcome h1 {
    font-size: 22px;
}

.welcome p {

    margin-top: 7px;

    max-width: 600px;

    color: rgba(255,255,255,.35);

    font-size: 12px;

    line-height: 1.6;
}


/* =========================================================
   MESSAGE
========================================================= */

.message {

    display: flex;

    gap: 10px;

    padding: 8px 5px;

    border-radius: 8px;
}

.message:hover {
    background: rgba(255,255,255,.025);
}

.message-avatar {

    width: 37px;
    height: 37px;

    flex-shrink: 0;

    border-radius: 50%;

    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #181823;
}

.message-avatar img {

    width: 100%;
    height: 100%;

    object-fit: cover;
}

.message-body {

    min-width: 0;

    flex: 1;
}

.message-head {

    display: flex;

    align-items: center;

    gap: 7px;

    flex-wrap: wrap;
}

.message-author {

    font-size: 12px;
    font-weight: bold;
}

.message-time {

    color: rgba(255,255,255,.2);

    font-family: monospace;

    font-size: 7px;
}

.creator-badge {

    padding: 2px 5px;

    border-radius: 4px;

    color: #b7adff;

    background: rgba(110,92,255,.12);

    border: 1px solid rgba(135,120,255,.2);

    font-family: monospace;

    font-size: 6px;
}

.message-text {

    margin-top: 4px;

    color: rgba(255,255,255,.72);

    font-size: 13px;

    line-height: 1.55;

    word-break: break-word;
}

.delete-message {

    margin-top: 5px;

    padding: 0;

    border: 0;

    background: transparent;

    color: rgba(255,100,100,.55);

    font-family: monospace;

    font-size: 7px;

    cursor: pointer;
}


/* =========================================================
   INPUT
========================================================= */

.input-area {

    padding: 9px 13px;

    padding-bottom:
        max(
            9px,
            env(safe-area-inset-bottom)
        );

    background:
        linear-gradient(
            to top,
            #020204 75%,
            transparent
        );
}

.input-box {

    width: 100%;

    min-height: 48px;

    display: flex;
    align-items: center;

    gap: 7px;

    padding: 5px 7px 5px 13px;

    border: 1px solid rgba(255,255,255,.08);

    border-radius: 13px;

    background: rgba(11,11,18,.97);
}

#messageInput {

    flex: 1;

    min-width: 0;

    height: 36px;

    max-height: 120px;

    resize: none;

    outline: none;

    border: 0;

    background: transparent;

    color: white;

    line-height: 36px;

    font-size: 13px;
}

#messageInput::placeholder {
    color: rgba(255,255,255,.2);
}

#sendButton {

    width: 38px;
    height: 38px;

    flex-shrink: 0;

    border: 0;

    border-radius: 10px;

    background: #6254df;

    color: white;

    cursor: pointer;

    font-size: 16px;
}


/* =========================================================
   OVERLAY
========================================================= */

.overlay {

    position: fixed;

    inset: 0;

    z-index: 45;

    background: rgba(0,0,0,.68);

    opacity: 0;

    pointer-events: none;

    transition: opacity .2s;
}

.overlay.open {

    opacity: 1;

    pointer-events: auto;
}


/* =========================================================
   RIGHT PANELS
========================================================= */

.panel {

    position: fixed;

    top: 0;
    right: 0;

    width: min(380px, 100vw);

    height: 100dvh;

    z-index: 60;

    background: #08080e;

    border-left: 1px solid rgba(255,255,255,.07);

    transform: translateX(100%);

    transition: transform .25s ease;

    display: flex;
    flex-direction: column;
}

.panel.open {
    transform: translateX(0);
}

.panel-header {

    height: 70px;
    min-height: 70px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 15px;

    border-bottom: 1px solid rgba(255,255,255,.06);
}

.panel-title {

    font-family: monospace;

    font-size: 9px;

    letter-spacing: 1px;
}

.close {

    width: 40px;
    height: 40px;

    border: 1px solid rgba(255,255,255,.07);

    border-radius: 10px;

    background: rgba(255,255,255,.035);

    color: white;

    cursor: pointer;
}

.panel-content {

    flex: 1;

    overflow-y: auto;

    padding: 20px 15px;
}


/* =========================================================
   PROFILE
========================================================= */

.profile-big-avatar {

    width: 90px;
    height: 90px;

    margin: 5px auto 13px;

    border-radius: 50%;

    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #181823;

    border: 2px solid rgba(125,110,255,.3);
}

.profile-big-avatar img {

    width: 100%;
    height: 100%;

    object-fit: cover;
}

.profile-name {

    text-align: center;

    font-size: 19px;
    font-weight: bold;
}

.profile-handle {

    margin-top: 4px;

    text-align: center;

    color: rgba(255,255,255,.3);

    font-family: monospace;

    font-size: 9px;
}

.badge {

    width: max-content;

    margin: 10px auto 25px;

    padding: 5px 8px;

    border-radius: 6px;

    background: rgba(110,90,255,.1);

    border: 1px solid rgba(135,120,255,.2);

    color: #b7adff;

    font-family: monospace;

    font-size: 7px;
}


/* =========================================================
   FORM
========================================================= */

.form-group {
    margin-top: 17px;
}

.form-label {

    margin-bottom: 7px;

    color: rgba(255,255,255,.3);

    font-family: monospace;

    font-size: 8px;

    letter-spacing: 1px;
}

.form-input {

    width: 100%;

    height: 44px;

    padding: 0 11px;

    border: 1px solid rgba(255,255,255,.08);

    border-radius: 9px;

    outline: none;

    background: #040407;

    color: white;
}

.action-button {

    width: 100%;

    height: 44px;

    margin-top: 8px;

    border: 1px solid rgba(255,255,255,.08);

    border-radius: 9px;

    background: rgba(255,255,255,.035);

    color: white;

    cursor: pointer;
}

.action-button:hover {
    background: rgba(100,85,230,.12);
}

.danger-zone {

    margin-top: 30px;

    padding-top: 20px;

    border-top: 1px solid rgba(255,255,255,.07);
}

.delete-account {

    color: #ff7777;

    border-color: rgba(255,90,90,.18);

    background: rgba(255,70,70,.05);
}


/* =========================================================
   MEMBERS
========================================================= */

.member {

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 10px;

    border-radius: 9px;
}

.member:hover {
    background: rgba(255,255,255,.035);
}

.member-info {
    min-width: 0;
}

.member-name {

    font-size: 12px;
    font-weight: bold;
}

.member-role {

    margin-top: 3px;

    color: rgba(255,255,255,.25);

    font-family: monospace;

    font-size: 7px;
}


/* =========================================================
   SETTINGS
========================================================= */

.setting {

    padding: 13px 0;

    border-bottom: 1px solid rgba(255,255,255,.05);
}

.setting-name {
    font-size: 12px;
}

.setting-description {

    margin-top: 4px;

    color: rgba(255,255,255,.28);

    font-size: 9px;

    line-height: 1.5;
}


/* =========================================================
   MOBILE — PORTRAIT FIRST
========================================================= */

@media (max-width: 800px) {

    .sidebar {

        position: fixed;

        top: 0;
        left: 0;

        width: min(290px, 88vw);

        height: 100dvh;

        transform: translateX(-105%);

        transition: transform .25s ease;

        box-shadow: 20px 0 70px rgba(0,0,0,.55);
    }

    .sidebar.open {
        transform: translateX(0);
    }

    .menu-button {
        display: flex;
    }

    .chat {
        width: 100%;
        height: 100dvh;
        min-width: 0;
    }

    .chat-header {
        height: 62px;
        min-height: 62px;
        padding: 0 9px;
    }

    .channel-title {
        font-size: 14px;
    }

    .channel-topic {
        max-width: 180px;
    }

    .messages {
        padding: 12px 9px 8px;
    }

    .welcome {
        padding-top: 9px;
    }

    .welcome h1 {
        font-size: 19px;
    }

    .welcome p {
        font-size: 11px;
    }

    .message {
        padding-left: 2px;
        padding-right: 2px;
    }

    .message-text {
        font-size: 12px;
    }

    .input-area {
        padding-left: 7px;
        padding-right: 7px;
    }

    .members-button {
        width: 39px;
        height: 39px;
    }

}


/* =========================================================
   SMALL PORTRAIT
========================================================= */

@media (max-width: 390px) {

    .menu-button {
        width: 38px;
        height: 38px;
    }

    .channel-topic {
        max-width: 120px;
    }

    .welcome h1 {
        font-size: 18px;
    }

}


/* =========================================================
   LANDSCAPE
========================================================= */

@media (orientation: landscape) and (max-width: 800px) {

    .sidebar {
        width: 270px;
    }

}


/* =========================================================
   DESKTOP
========================================================= */

@media (min-width: 801px) {

    .overlay {
        display: none;
    }

}

</style>
</head>

     CHAT
====================================================== -->

    <header class="chat-header">

        <button
            class="menu-button"
            id="menuButton"
        >
            ☰
        </button>


        <div class="channel-info">

            <div
                class="channel-title"
                id="channelTitle"
            >
                # général
            </div>

            <div
