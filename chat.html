<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FLASH — Chat</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            height: 100vh;

            overflow: hidden;

            background: #111214;

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        /* =====================================
           STRUCTURE
        ===================================== */


        #app {

            height: 100vh;

            display: grid;

            grid-template-columns:
                70px
                220px
                1fr
                280px;
        }


        /* =====================================
           SERVEURS
        ===================================== */


        .servers {

            background: #0c0d0f;

            padding: 12px 10px;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 12px;
        }


        .server {

            width: 48px;

            height: 48px;

            border-radius: 15px;

            background: #1e1f22;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 22px;

            cursor: pointer;
        }


        .server.active {

            border-radius: 13px;

            background: #5865f2;
        }


        /* =====================================
           SIDEBAR
        ===================================== */


        .sidebar {

            background: #18191c;

            border-right:
                1px solid #303238;

            display: flex;

            flex-direction: column;
        }


        .server-name {

            height: 65px;

            display: flex;

            align-items: center;

            padding: 0 18px;

            font-size: 18px;

            font-weight: bold;

            border-bottom:
                1px solid #303238;
        }


        .channels {

            padding: 15px 10px;
        }


        .channel {

            padding: 10px;

            border-radius: 7px;

            color: #aeb1b7;

            cursor: pointer;
        }


        .channel.active {

            background: #2b2d31;

            color: white;
        }


        .channel:hover {

            background: #2b2d31;

            color: white;
        }


        /* =====================================
           CHAT
        ===================================== */


        .chat {

            min-width: 0;

            display: grid;

            grid-template-rows:
                65px
                1fr
                auto;

            background: #111214;
        }


        .chat-header {

            display: flex;

            align-items: center;

            padding: 0 20px;

            border-bottom:
                1px solid #303238;

            background: #18191c;
        }


        .chat-title {

            font-size: 17px;

            font-weight: bold;
        }


        #messages {

            overflow-y: auto;

            padding: 25px;
        }


        .message {

            margin-bottom: 20px;

            display: flex;

            gap: 10px;
        }


        .avatar {

            width: 40px;

            height: 40px;

            flex-shrink: 0;

            border-radius: 50%;

            background: #5865f2;

            display: flex;

            align-items: center;

            justify-content: center;

            font-weight: bold;
        }


        .message-body {

            min-width: 0;
        }


        .message-header {

            display: flex;

            align-items: center;

            gap: 7px;

            margin-bottom: 3px;
        }


        .message-user {

            font-weight: bold;
        }


        .message-time {

            color: #777a82;

            font-size: 11px;
        }


        .message-content {

            color: #dedfe2;

            white-space: pre-wrap;

            overflow-wrap: anywhere;
        }


        /* =====================================
           BADGES
        ===================================== */


        .badge {

            width: 19px;

            height: 19px;

            object-fit: contain;

            display: inline-block;

            vertical-align: middle;
        }


        .profile-badge {

            width: 30px;

            height: 30px;

            object-fit: contain;
        }


        /* =====================================
           MESSAGE INPUT
        ===================================== */


        #form {

            display: flex;

            gap: 10px;

            padding: 14px;

            background: #18191c;

            border-top:
                1px solid #303238;
        }


        #input {

            flex: 1;

            min-width: 0;

            padding: 13px;

            border:
                1px solid #3b3d44;

            border-radius: 8px;

            background: #111214;

            color: white;

            outline: none;

            font-size: 15px;
        }


        #input:focus {

            border-color: #5865f2;
        }


        #send {

            width: 55px;

            border: none;

            border-radius: 8px;

            background: #5865f2;

            color: white;

            font-size: 20px;

            cursor: pointer;
        }


        /* =====================================
           PROFILE
        ===================================== */


        .profile {

            background: #18191c;

            border-left:
                1px solid #303238;

            overflow-y: auto;
        }


        .profile-banner {

            height: 100px;

            background:
                linear-gradient(
                    135deg,
                    #5865f2,
                    #8b5cf6
                );
        }


        .profile-content {

            padding: 0 20px 25px;
        }


        .profile-avatar {

            width: 82px;

            height: 82px;

            margin-top: -41px;

            border: 6px solid #18191c;

            border-radius: 50%;

            background: #5865f2;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 28px;

            font-weight: bold;
        }


        .profile-name {

            margin-top: 12px;

            display: flex;

            align-items: center;

            gap: 7px;

            font-size: 21px;

            font-weight: bold;
        }


        .profile-username {

            color: #aeb1b7;

            font-size: 14px;

            margin-top: 3px;
        }


        .profile-section {

            margin-top: 25px;

            padding-top: 18px;

            border-top:
                1px solid #303238;
        }


        .profile-title {

            margin-bottom: 10px;

            font-size: 12px;

            font-weight: bold;

            color: #aeb1b7;

            text-transform: uppercase;
        }


        .profile-info {

            color: #dedfe2;

            font-size: 14px;

            line-height: 1.7;
        }


        #timer {

            color: #aeb1b7;
        }


        .delete {

            width: 100%;

            margin-top: 25px;

            padding: 11px;

            border: none;

            border-radius: 8px;

            background: #c43d3d;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }


        .delete:hover {

            background: #df4a4a;
        }


        /* =====================================
           MOBILE
        ===================================== */


        @media (max-width: 1000px) {

            #app {

                grid-template-columns:
                    60px
                    180px
                    1fr;
            }


            .profile {

                display: none;
            }

        }


        @media (max-width: 650px) {

            #app {

                grid-template-columns:
                    55px
                    1fr;
            }


            .sidebar {

                display: none;
            }


            .servers {

                padding:
                    10px 5px;
            }


            #messages {

                padding: 18px;
            }


            .account-mobile {

                display: none;
            }

        }

    </style>

</head>


<body>


<div id="app">


    <!-- =================================
         SERVEURS
    ================================== -->


    <aside class="servers">


        <div class="server active">

            ⚡

        </div>


        <div class="server">

            +

        </div>


    </aside>



    <!-- =================================
         CHANNELS
    ================================== -->


    <aside class="sidebar">


        <div class="server-name">

            FLASH

        </div>


        <div class="channels">


            <div class="channel active">

                # général

            </div>


            <div class="channel">

                # random

            </div>


            <div class="channel">

                # discussion

            </div>


        </div>


    </aside>



    <!-- =================================
         CHAT
    ================================== -->


    <main class="chat">


        <header class="chat-header">

            <div class="chat-title">

                # général

            </div>

        </header>


        <section id="messages"></section>


        <form id="form">


            <input

                maxlength="1000"

            >


            <button
                id="send"
                type="submit"

                ➤

            </button>


        </form>


    </main>



    <!-- =================================
         PROFIL
    ================================== -->


    <aside class="profile">


        <div class="profile-banner"></div>


        <div class="profile-content">


            <div
                id="profileAvatar"
                class="profile-avatar"
            >

                ?

            </div>


            <div class="profile-name">


                <span id="profileName">
                    -
                </span>


                <!-- BADGE CRÉATEUR -->

                <img
                    id="profileBadge"
                    class="profile-badge"
                    src="VIP_Badge.webp"
                    alt="Badge créateur"
                >


            </div>


            <div
                id="profileUsername"
                class="profile-username"
            >

                @-

            </div>


            <div class="profile-section">


                <div class="profile-title">

                    Compte

                </div>


                <div
                    id="profileInfo"
                    class="profile-info"
                >

                </div>


            </div>


            <button
                id="delete"
                class="delete"
            >

                Supprimer mon compte

            </button>


        </div>


    </aside>


</div>



<script>


/* =====================================================
   FLASH V0 — CHAT
===================================================== */


const STORAGE_KEY = "FLASH_V0";


/* ==============================================
   CHARGER
============================================== */


function loadState() {

    try {

        const data =
            localStorage.getItem(
                STORAGE_KEY
            );


        if (!data) {

            return null;

        }


        return JSON.parse(data);

    }

    catch {

        return null;

    }

}


/* ==============================================
   SAUVEGARDER
============================================== */


function saveState() {

    localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify(state)

    );

}


/* ==============================================
   ID
============================================== */


function generateID() {

    return (

        Date.now() +

        "-" +

        Math.random()
            .toString(36)
            .substring(2)

    );

}


/* ==============================================
   COMPTE
============================================== */


let state = loadState();


if (!state || !state.account) {

    window.location.href =
        "index.html";

}


/* ==============================================
   EXPIRATION
============================================== */


function isExpired() {

    if (
        state.account.expiresAt === 0
    ) {

        return false;

    }


    return (

        Date.now() >=
        state.account.expiresAt

    );

}


function expireAccount() {

    localStorage.removeItem(
        STORAGE_KEY
    );


    window.location.href =
        "index.html";

}


/* ==============================================
   TIMER
============================================== */


function updateTimer() {


    const timer =
        document.getElementById(
            "timer"
        );


    if (
        state.account.expiresAt === 0
    ) {

        return;

    }


    if (isExpired()) {

        expireAccount();

        return;

    }


}


/* ==============================================
   TEMPS
============================================== */


function formatTime(ms) {


    let seconds =
        Math.floor(ms / 1000);


    const days =
        Math.floor(
            seconds / 86400
        );


    seconds %= 86400;


    const hours =
        Math.floor(
            seconds / 3600
        );


    seconds %= 3600;


    const minutes =
        Math.floor(
            seconds / 60
        );


    seconds %= 60;


    if (days > 0) {

        return (
            days +
            "j " +
            hours +
            "h"
        );

    }


    if (hours > 0) {

        return (
            hours +
            "h " +
            minutes +
            "min"
        );

    }


    if (minutes > 0) {

        return (
            minutes +
            "min " +
            seconds +
            "s"
        );

    }


    return seconds + "s";

}


/* ==============================================
   PROFIL
============================================== */


function loadProfile() {


    const account =
        state.account;


    document
        .getElementById("profileName")
        .textContent =
            account.username;


    document
        .getElementById("profileUsername")
        .textContent =
            "@" + account.username;


    document
        .getElementById("profileAvatar")
        .textContent =
            account.username
                .charAt(0)
                .toUpperCase();


    let durationText;


    if (
        account.expiresAt === 0
    ) {

        durationText =
            "♾️ Illimitée";

    }

    else {

        durationText =
            formatTime(

                account.expiresAt -
                Date.now()

            );

    }


    document
        .getElementById("profileInfo")
        .innerHTML =

            "ID : " +
            account.id +

            "<br>" +

            "Créé le : " +

            new Date(
                account.createdAt
            ).toLocaleDateString(
                "fr-FR"
            ) +

            "<br>" +

            "Temps restant : " +

            durationText;


    /*
     * BADGE
     *
     * Pour la V0 locale :
     * le compte créé ici possède
     * le rôle creator.
     */


    const badge =
        document.getElementById(
            "profileBadge"
        );


    if (
        account.role === "creator"
    ) {

        badge.style.display =
            "inline-block";

    }

    else {

        badge.style.display =
            "none";

    }

}


/* ==============================================
   MESSAGES
============================================== */


function renderMessages() {


    const container =
        document.getElementById(
            "messages"
        );


    container.innerHTML = "";


    for (
        const message
        of state.messages
    ) {


        const article =
            document.createElement(
                "article"
            );


        article.className =
            "message";


        const avatar =
            document.createElement(
                "div"
            );


        avatar.className =
            "avatar";


        avatar.textContent =
            message.username
                .charAt(0)
                .toUpperCase();


        const body =
            document.createElement(
                "div"
            );


        body.className =
            "message-body";


        const header =
            document.createElement(
                "div"
            );


        header.className =
            "message-header";


        const username =
            document.createElement(
                "span"
            );


        username.className =
            "message-user";


        username.textContent =
            "@" + message.username;


        /*
         * Badge du créateur
         */


        if (
            message.role === "creator"
        ) {


            const badge =
                document.createElement(
                    "img"
                );


            badge.className =
                "badge";


            badge.src =
                "VIP_Badge.png";


            badge.alt =
                "Badge créateur";


            header.appendChild(
                badge
            );

        }


        const time =
            document.createElement(
                "span"
            );


        time.className =
            "message-time";


        time.textContent =

            new Date(
                message.createdAt
            ).toLocaleTimeString(

                "fr-FR",

                {

                    hour: "2-digit",

                    minute: "2-digit"

                }

            );


        header.prepend(
            username
        );


        header.appendChild(
            time
        );


        const content =
            document.createElement(
                "div"
            );


        content.className =
            "message-content";


        content.textContent =
            message.text;


        body.appendChild(header);

        body.appendChild(content);


        article.appendChild(avatar);

        article.appendChild(body);


        container.appendChild(article);

    }


    container.scrollTop =
        container.scrollHeight;

}
