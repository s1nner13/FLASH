<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>FLASH — Chat</title>

<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #111214;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

button,
input {
    font-family: inherit;
}


/* =====================================================
   APP
===================================================== */

#app {
    width: 100%;
    height: 100dvh;

    display: grid;

    grid-template-columns:
        64px
        210px
        minmax(0, 1fr)
        270px;
}


/* =====================================================
   SERVERS
===================================================== */

.servers {
    background: #0b0c0e;

    display: flex;
    flex-direction: column;

    align-items: center;

    gap: 12px;

    padding: 12px 8px;
}

.server {
    width: 46px;
    height: 46px;

    border-radius: 14px;

    background: #1e1f22;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 21px;

    cursor: pointer;

    transition: .15s;
}

.server:hover {
    border-radius: 10px;
}

.server.active {
    background: #5865f2;
}


/* =====================================================
   CHANNEL SIDEBAR
===================================================== */

.sidebar {
    background: #18191c;

    border-right: 1px solid #303238;

    min-width: 0;
}

.server-title {
    height: 64px;

    display: flex;
    align-items: center;

    padding: 0 17px;

    font-size: 18px;
    font-weight: 800;

    border-bottom: 1px solid #303238;
}

.channel-list {
    padding: 12px 9px;
}

.channel-category {
    padding: 8px;

    color: #777a82;

    font-size: 11px;
    font-weight: 800;

    text-transform: uppercase;
}

.channel {
    width: 100%;

    padding: 10px;

    border-radius: 7px;

    border: 0;

    background: transparent;

    color: #aeb1b7;

    text-align: left;

    cursor: pointer;

    font-size: 14px;
}

.channel:hover {
    background: #2b2d31;
    color: white;
}

.channel.active {
    background: #2b2d31;
    color: white;
}


/* =====================================================
   CHAT
===================================================== */

.chat {
    min-width: 0;
    min-height: 0;

    display: grid;

    grid-template-rows:
        64px
        minmax(0, 1fr)
        auto;
}

.chat-header {
    display: flex;
    align-items: center;

    padding: 0 20px;

    background: #18191c;

    border-bottom: 1px solid #303238;
}

.chat-title {
    font-weight: 800;
}

.chat-description {
    margin-left: 12px;

    color: #777a82;

    font-size: 13px;
}


/* =====================================================
   MESSAGES
===================================================== */

#messages {
    min-height: 0;

    overflow-y: auto;

    padding: 22px;
}

.empty {
    color: #777a82;

    text-align: center;

    margin-top: 50px;
}

.message {
    display: flex;

    gap: 11px;

    margin-bottom: 19px;
}

.message-avatar {
    width: 40px;
    height: 40px;

    flex-shrink: 0;

    border-radius: 50%;

    object-fit: cover;

    background: #5865f2;
}

.message-avatar-text {
    width: 40px;
    height: 40px;

    flex-shrink: 0;

    border-radius: 50%;

    background: #5865f2;

    display: flex;
    align-items: center;
    justify-content: center;

    font-weight: 800;
}

.message-body {
    min-width: 0;
}

.message-header {
    display: flex;
    align-items: center;

    gap: 7px;

    margin-bottom: 3px;
}

.message-user {
    font-weight: 800;
}

.message-time {
    color: #777a82;
    font-size: 11px;
}

.message-badge {
    width: 18px;
    height: 18px;

    object-fit: contain;
}

.message-content {
    color: #dedfe2;

    white-space: pre-wrap;
    overflow-wrap: anywhere;
}


/* =====================================================
   MESSAGE INPUT
===================================================== */

#form {
    display: flex;

    gap: 10px;

    padding: 13px;

    background: #18191c;

    border-top: 1px solid #303238;
}

#input {
    min-width: 0;
    flex: 1;

    padding: 12px;

    border: 1px solid #3b3d44;

    border-radius: 8px;

    background: #111214;

    color: white;

    outline: none;
}

#input:focus {
    border-color: #5865f2;
}

#send {
    width: 52px;

    border: 0;
    border-radius: 8px;

    background: #5865f2;

    color: white;

    font-size: 19px;

    cursor: pointer;
}


/* =====================================================
   PROFILE
===================================================== */

.profile {
    background: #18191c;

    border-left: 1px solid #303238;

    overflow-y: auto;
}

.profile-banner {
    height: 100px;

    background:
        linear-gradient(
            135deg,
            #5865f2,
            #8b5cf6
        );
}

.profile-content {
    padding: 0 20px 25px;
}

.profile-avatar-wrapper {
    position: relative;

    width: 86px;
    height: 86px;

    margin-top: -43px;
}

.profile-avatar {
    width: 86px;
    height: 86px;

    border: 6px solid #18191c;

    border-radius: 50%;

    object-fit: cover;

    background: #5865f2;
}

.profile-avatar-text {
    width: 86px;
    height: 86px;

    border: 6px solid #18191c;

    border-radius: 50%;

    background: #5865f2;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 29px;
    font-weight: 900;
}

.change-avatar {
    width: 100%;

    margin-top: 10px;

    padding: 9px;

    border: 1px solid #3b3d44;

    border-radius: 7px;

    background: #232428;

    color: white;

    cursor: pointer;
}

.change-avatar:hover {
    background: #2b2d31;
}

.profile-name {
    margin-top: 13px;

    display: flex;
    align-items: center;

    gap: 7px;

    font-size: 20px;
    font-weight: 900;
}

.profile-badge {
    width: 21px;
    height: 21px;

    object-fit: contain;
}

.profile-username {
    margin-top: 3px;

    color: #aeb1b7;

    font-size: 14px;
}

.profile-section {
    margin-top: 24px;

    padding-top: 17px;

    border-top: 1px solid #303238;
}

.profile-title {
    margin-bottom: 9px;

    color: #aeb1b7;

    font-size: 11px;
    font-weight: 800;

    text-transform: uppercase;
}

.profile-info {
    color: #dedfe2;

    font-size: 13px;

    line-height: 1.7;

    overflow-wrap: anywhere;
}

.delete {
    width: 100%;

    margin-top: 25px;

    padding: 11px;

    border: 0;

    border-radius: 8px;

    background: #c43d3d;

    color: white;

    font-weight: 800;

    cursor: pointer;
}

.delete:hover {
    background: #df4a4a;
}


/* =====================================================
   MOBILE NAVIGATION
===================================================== */

.mobile-nav {
    display: none;
}


/* =====================================================
   MOBILE PORTRAIT
===================================================== */

@media (max-width: 900px) {

    #app {
        grid-template-columns:
            58px
            minmax(0, 1fr);
    }

    .sidebar {
        display: none;
    }

    .profile {
        display: none;
    }

    .mobile-nav {
        display: flex;

        position: fixed;

        left: 0;
        right: 0;
        bottom: 0;

        height: 58px;

        z-index: 20;

        background: #18191c;

        border-top: 1px solid #303238;

        align-items: center;
        justify-content: space-around;
    }

    .mobile-nav button {
        width: 25%;

        height: 100%;

        border: 0;

        background: transparent;

        color: #aeb1b7;

        font-size: 21px;

        cursor: pointer;
    }

    .mobile-nav button.active {
        color: white;
    }

    #messages {
        padding-bottom: 75px;
    }

    #form {
        padding-bottom: 13px;
    }

}


/* =====================================================
   SMALL PHONE
===================================================== */

@media (max-width: 600px) {

    #app {
        display: block;
    }

    .servers {
        display: none;
    }

    .chat {
        width: 100%;
        height: 100dvh;
    }

    .chat-header {
        height: 58px;

        padding: 0 15px;
    }

    .chat-description {
        display: none;
    }

    #messages {
        padding: 15px;

        padding-bottom: 70px;
    }

    #form {
        padding: 9px;
    }

    #input {
        padding: 11px;
    }

    #send {
        width: 48px;
    }

}


/* =====================================================
   PANNEAUX MOBILES
===================================================== */

.mobile-panel {
    position: fixed;

    inset: 0;

    z-index: 30;

    display: none;

    background: #111214;
}

.mobile-panel.open {
    display: block;
}

.mobile-panel-header {
    height: 60px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 16px;

    background: #18191c;

    border-bottom: 1px solid #303238;
}

.mobile-panel-title {
    font-weight: 800;
}

.close-panel {
    border: 0;

    background: transparent;

    color: white;

    font-size: 22px;
}

.mobile-channels {
    padding: 15px;
}

.mobile-profile {
    overflow-y: auto;

    height: calc(100dvh - 60px);
}

</style>

</head>


<body>


<div id="app">


    <!-- SERVEURS -->

    <aside class="servers">

        <div class="server active">
            ⚡
        </div>

        <div class="server">
            +
        </div>

    </aside>


    <!-- SALONS -->

    <aside class="sidebar">

        <div class="server-title">
            FLASH
        </div>

        <div class="channel-list">

            <div class="channel-category">
                Salons
            </div>

            <button
                class="channel active"
                data-channel="general"
            >
                # général
            </button>

            <button
                class="channel"
                data-channel="random"
            >
                # random
            </button>

            <button
                class="channel"
                data-channel="discussion"
            >
                # discussion
            </button>

        </div>

    </aside>


    <!-- CHAT -->

    <main class="chat">

        <header class="chat-header">

            <div
                id="chatTitle"
                class="chat-title"
            >
                # général
            </div>

            <div
                id="chatDescription"
                class="chat-description"
            >
                Discussion générale
            </div>

        </header>


        <section id="messages"></section>


        <form id="form">

            <input
                id="input"
                type="text"
                maxlength="1000"
                placeholder="Écrire un message..."
                autocomplete="off"
            >

            <button id="send" type="submit">
                ➤
            </button>

        </form>

    </main>


    <!-- PROFIL -->

    <aside class="profile">

        <div class="profile-banner"></div>

        <div class="profile-content">

            <div class="profile-avatar-wrapper">

                <img
                    id="profileAvatar"
                    class="profile-avatar"
                    alt="PDP"
                >

                <div
                    id="profileAvatarText"
                    class="profile-avatar-text"
                ></div>

            </div>


            <input
                id="avatarInput"
                type="file"
                accept="image/*"
                hidden
            >


            <button
                id="changeAvatar"
                class="change-avatar"
            >
                Changer la PDP
            </button>


            <div class="profile-name">

                <span id="profileName"></span>

                <img
                    id="profileBadge"
                    class="profile-badge"
                    src="VIP_Badge.webp"
                    alt="Badge créateur"
                >

            </div>


            <div
                id="profileUsername"
                class="profile-username"
            ></div>


            <div class="profile-section">

                <div class="profile-title">
                    Compte
                </div>

                <div
                    id="profileInfo"
                    class="profile-info"
                ></div>

            </div>


            <button
                id="delete"
                class="delete"
            >
                Supprimer mon compte
            </button>

        </div>

    </aside>

</div>


<!-- NAVIGATION MOBILE -->

<nav class="mobile-nav">

    <button
        id="mobileChannels"
        class="active"
    >
        💬
    </button>

    <button id="mobileProfile">
        👤
    </button>

</nav>


<!-- PANNEAU SALONS MOBILE -->

<div
    id="channelsPanel"
    class="mobile-panel"
>

    <header class="mobile-panel-header">

        <span class="mobile-panel-title">
            Salons
        </span>

        <button
            class="close-panel"
            data-close="channelsPanel"
        >
            ×
        </button>

    </header>


    <div class="mobile-channels">

        <button
            class="channel active"
            data-channel="general"
        >
            # général
        </button>

        <button
            class="channel"
            data-channel="random"
        >
            # random
        </button>

        <button
            class="channel"
            data-channel="discussion"
        >
            # discussion
        </button>

    </div>

</div>


<!-- PANNEAU PROFIL MOBILE -->

<div
    id="profilePanel"
    class="mobile-panel"
>

    <header class="mobile-panel-header">

        <span class="mobile-panel-title">
            Profil
        </span>

        <button
            class="close-panel"
            data-close="profilePanel"
        >
            ×
        </button>

    </header>


    <div class="mobile-profile">

        <div class="profile-banner"></div>

        <div class="profile-content">

            <div class="profile-avatar-wrapper">

                <img
                    id="mobileProfileAvatar"
                    class="profile-avatar"
                    alt="PDP"
                >

                <div
                    id="mobileProfileAvatarText"
                    class="profile-avatar-text"
                ></div>

            </div>


            <button
                id="mobileChangeAvatar"
                class="change-avatar"
            >
                Changer la PDP
            </button>


            <div class="profile-name">

                <span id="mobileProfileName"></span>

                <img
                    class="profile-badge"
                    src="VIP_Badge.webp"
                    alt="Badge créateur"
                >

            </div>


            <div
                id="mobileProfileUsername"
                class="profile-username"
            ></div>


            <div class="profile-section">

                <div class="profile-title">
                    Compte
                </div>

                <div
                    id="mobileProfileInfo"
                    class="profile-info"
                ></div>

            </div>


            <button
                id="mobileDelete"
                class="delete"
            >
                Supprimer mon compte
            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const STORAGE_KEY = "FLASH_V0";

const CREATOR_BADGE =
    "VIP_Badge.webp";


/* =====================================================
   STATE
===================================================== */

let state =
    loadState();


let currentChannel =
    localStorage.getItem(
        "FLASH_CURRENT_CHANNEL"
    ) || "general";


/* =====================================================
   LOAD STATE
===================================================== */

function loadState() {

    try {

        const data =
            localStorage.getItem(
                STORAGE_KEY
            );

        if (!data) {
            return null;
        }

        return JSON.parse(data);

    } catch {

        return null;

    }

}


/* =====================================================
   SAVE STATE
===================================================== */

function saveState() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(state)
    );

}


/* =====================================================
   ID
===================================================== */

function generateID() {

    return (
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .substring(2)
    );

}


/* =====================================================
   CHECK ACCOUNT
===================================================== */

if (
    !state ||
    !state.account
) {

    window.location.href =
        "index.html";

}


/* =====================================================
   EXPIRATION
===================================================== */

function isExpired() {

    if (
        state.account.expiresAt === 0
    ) {

        return false;

    }

    return (
        Date.now() >=
        state.account.expiresAt
    );

}


function expireAccount() {

    localStorage.removeItem(
        STORAGE_KEY
    );

    window.location.href =
        "index.html";

}


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(ms) {

    let seconds =
        Math.floor(ms / 1000);

    const days =
        Math.floor(
            seconds / 86400
        );

    seconds %= 86400;

    const hours =
        Math.floor(
            seconds / 3600
        );

    seconds %= 3600;

    const minutes =
        Math.floor(
            seconds / 60
        );

    seconds %= 60;


    if (days > 0) {

        return (
            days +
            "j " +
            hours +
            "h"
        );

    }

    if (hours > 0) {

        return (
            hours +
            "h " +
            minutes +
            "min"
        );

    }

    if (minutes > 0) {

        return (
            minutes +
            "min " +
            seconds +
            "s"
        );

    }

    return seconds + "s";

}

   PROFILE
===================================================== */

    document

        )
        .textContent =
            username;
