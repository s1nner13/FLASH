<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#000000"
>

<title>FLASH — Enter the Void</title>


<style>

/* =========================================================
   FLASH V0.3
   COSMIC INTERFACE
========================================================= */

:root {

    --bg: #000004;

    --panel:
        rgba(8, 8, 15, .72);

    --line:
        rgba(150, 140, 255, .18);

    --text:
        #f5f4ff;

    --muted:
        rgba(235, 232, 255, .42);

    --purple:
        #806dff;

    --blue:
        #5d8dff;

    --pink:
        #c06cff;

}


/* =========================================================
   RESET
========================================================= */

* {

    box-sizing:
        border-box;

}


html,
body {

    width: 100%;
    min-height: 100%;

    margin: 0;

}


body {

    min-height:
        100dvh;

    overflow:
        hidden;

    background:
        #000004;

    color:
        var(--text);

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

}


/* =========================================================
   COSMOS
========================================================= */

.cosmos {

    position:
        fixed;

    inset:
        0;

    overflow:
        hidden;

    pointer-events:
        none;

    z-index:
        0;

}


/* =========================================================
   STAR LAYERS
========================================================= */

.stars {

    position:
        absolute;

    inset:
        -50%;

    background-image:

        radial-gradient(
            circle,
            rgba(255,255,255,.85) 0 1px,
            transparent 1.5px
        ),

        radial-gradient(
            circle,
            rgba(140,150,255,.55) 0 1px,
            transparent 1.4px
        ),

        radial-gradient(
            circle,
            rgba(255,255,255,.3) 0 1px,
            transparent 1.3px
        );

    background-size:
        115px 115px,
        185px 185px,
        290px 290px;

    animation:
        starDrift 100s linear infinite;

}


.stars::before {

    content:
        "";

    position:
        absolute;

    inset:
        0;

    background:

        radial-gradient(
            ellipse at center,
            transparent 0 25%,
            rgba(0,0,0,.65) 68%,
            #000 100%
        );

}


@keyframes starDrift {

    from {

        transform:
            translate3d(0,0,0);

    }

    to {

        transform:
            translate3d(220px,130px,0);

    }

}


/* =========================================================
   NEBULA
========================================================= */

.nebula {

    position:
        absolute;

    left:
        50%;

    top:
        50%;

    width:
        110vw;

    height:
        110vw;

    max-width:
        1300px;

    max-height:
        1300px;

    transform:
        translate(-50%,-50%);

    border-radius:
        50%;

    background:

        radial-gradient(
            circle at 50% 50%,
            rgba(92,72,255,.13),
            transparent 26%
        ),

        radial-gradient(
            circle at 25% 40%,
            rgba(80,120,255,.08),
            transparent 28%
        ),

        radial-gradient(
            circle at 75% 60%,
            rgba(190,70,255,.08),
            transparent 30%
        );

    filter:
        blur(55px);

    animation:
        nebulaPulse 10s ease-in-out infinite alternate;

}


@keyframes nebulaPulse {

    from {

        opacity:
            .55;

        transform:
            translate(-50%,-50%)
            scale(.92);

    }

    to {

        opacity:
            1;

        transform:
            translate(-50%,-50%)
            scale(1.08);

    }

}


/* =========================================================
   GRID
========================================================= */

.grid {

    position:
        absolute;

    left:
        50%;

    bottom:
        -15%;

    width:
        180%;

    height:
        65%;

    transform:
        translateX(-50%)
        perspective(400px)
        rotateX(62deg);

    background-image:

        linear-gradient(
            rgba(120,110,255,.11) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(120,110,255,.11) 1px,
            transparent 1px
        );

    background-size:
        55px 55px;

    mask-image:
        linear-gradient(
            to top,
            black,
            transparent
        );

    opacity:
        .35;

}


/* =========================================================
   BLACK HOLE
========================================================= */

.black-hole-system {

    position:
        absolute;

    left:
        50%;

    top:
        50%;

    width:
        min(560px, 70vw);

    aspect-ratio:
        1;

    transform:
        translate(-50%,-50%);

}


/* =========================================================
   OUTER GRAVITY
========================================================= */

.gravity-ring {

    position:
        absolute;

    inset:
        2%;

    border-radius:
        50%;

    border:
        1px solid
        rgba(130,120,255,.15);

    box-shadow:

        0 0 80px
        rgba(90,80,255,.08),

        inset 0 0 80px
        rgba(100,80,255,.07);

    animation:
        gravityPulse 6s ease-in-out infinite alternate;

}


@keyframes gravityPulse {

    from {

        transform:
            scale(.96);

        opacity:
            .35;

    }

    to {

        transform:
            scale(1.04);

        opacity:
            .85;

    }

}


/* =========================================================
   ACCRETION DISK
========================================================= */

.accretion {

    position:
        absolute;

    left:
        50%;

    top:
        50%;

    width:
        105%;

    height:
        42%;

    transform:
        translate(-50%,-50%)
        rotate(-12deg)
        perspective(500px)
        rotateX(63deg);

    border-radius:
        50%;

    background:

        conic-gradient(

            from 0deg,

            transparent 0deg,

            rgba(70,90,255,.15) 35deg,

            rgba(110,80,255,.65) 65deg,

            rgba(255,170,90,.9) 90deg,

            rgba(255,220,150,.55) 105deg,

            rgba(110,80,255,.65) 140deg,

            transparent 190deg,

            rgba(70,120,255,.25) 235deg,

            rgba(180,80,255,.75) 285deg,

            transparent 335deg

        );

    filter:
        blur(8px);

    opacity:
        .95;

    animation:
        accretionSpin 14s linear infinite;

}


.accretion::before {

    content:
        "";

    position:
        absolute;

    inset:
        10%;

    border-radius:
        50%;

    border:
        8px solid
        rgba(255,255,255,.11);

    filter:
        blur(7px);

}


.accretion::after {

    content:
        "";

    position:
        absolute;

    left:
        50%;

    top:
        50%;

    width:
        43%;

    height:
        80%;

    transform:
        translate(-50%,-50%);

    border-radius:
        50%;

    background:
        #000;

    box-shadow:
        0 0 45px #000;

}


@keyframes accretionSpin {

    from {

        transform:
            translate(-50%,-50%)
            rotate(-12deg)
            perspective(500px)
            rotateX(63deg)
            rotate(0deg);

    }

    to {

        transform:
            translate(-50%,-50%)
            rotate(-12deg)
            perspective(500px)
            rotateX(63deg)
            rotate(360deg);

    }

}


/* =========================================================
   EVENT HORIZON
========================================================= */

.horizon {

    position:
        absolute;

    left:
        50%;

    top:
        50%;

    width:
        34%;

    aspect-ratio:
        1;

    transform:
        translate(-50%,-50%);

    border-radius:
        50%;

    background:
        #000;

    box-shadow:

        0 0 30px
        rgba(0,0,0,.95),

        0 0 75px
        rgba(40,30,100,.25);

    z-index:
        4;

}


/* =========================================================
   HORIZON GLOW
========================================================= */

.horizon-glow {

    position:
        absolute;

    left:
        50%;

    top:
        50%;

    width:
        43%;

    aspect-ratio:
        1;

    transform:
        translate(-50%,-50%);

    border-radius:
        50%;

    border:
        2px solid
        rgba(175,150,255,.25);

    box-shadow:

        0 0 35px
        rgba(130,100,255,.22),

        0 0 80px
        rgba(90,80,255,.12);

    animation:
        horizonPulse 4s ease-in-out infinite alternate;

    z-index:
        3;

}


@keyframes horizonPulse {

    from {

        opacity:
            .35;

        transform:
            translate(-50%,-50%)
            scale(.96);

    }

    to {

        opacity:
            .9;

        transform:
            translate(-50%,-50%)
            scale(1.04);

    }

}


/* =========================================================
   PARTICLES
========================================================= */

.particle-field {

    position:
        absolute;

    inset:
        0;

}


.particle {

    position:
        absolute;

    width:
        2px;

    height:
        2px;

    border-radius:
        50%;

    background:
        white;

    box-shadow:
        0 0 7px white;

    animation:
        particleOrbit
        var(--speed)
        linear infinite;

}


@keyframes particleOrbit {

    from {

        transform:
            rotate(0deg)
            translateX(var(--distance))
            rotate(0deg);

        opacity:
            0;

    }

    15% {

        opacity:
            1;

    }

    85% {

        opacity:
            1;

    }

    to {

        transform:
            rotate(360deg)
            translateX(var(--distance))
            rotate(-360deg);

        opacity:
            0;

    }

}


/* =========================================================
   SCANLINES
========================================================= */

.scanlines {

    position:
        fixed;

    inset:
        0;

    z-index:
        20;

    pointer-events:
        none;

    background:

        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.018) 0,
            rgba(255,255,255,.018) 1px,
            transparent 1px,
            transparent 5px
        );

    opacity:
        .35;

}


.scanline {

    position:
        absolute;

    left:
        0;

    right:
        0;

    height:
        1px;

    background:
        rgba(150,140,255,.18);

    box-shadow:
        0 0 10px
        rgba(120,110,255,.15);

    animation:
        scan 8s linear infinite;

}


@keyframes scan {

    from {

        top:
            -5%;

    }

    to {

        top:
            105%;

    }

}


/* =========================================================
   HUD CORNERS
========================================================= */

.hud {

    position:
        fixed;

    inset:
        22px;

    z-index:
        5;

    pointer-events:
        none;

}


.corner {

    position:
        absolute;

    width:
        45px;

    height:
        45px;

    border-color:
        rgba(150,140,255,.35);

    border-style:
        solid;

}


.corner.tl {

    top:
        0;

    left:
        0;

    border-width:
        1px 0 0 1px;

}


.corner.tr {

    top:
        0;

    right:
        0;

    border-width:
        1px 1px 0 0;

}


.corner.bl {

    bottom:
        0;

    left:
        0;

    border-width:
        0 0 1px 1px;

}


.corner.br {

    bottom:
        0;

    right:
        0;

    border-width:
        0 1px 1px 0;

}


/* =========================================================
   SYSTEM LABELS
========================================================= */

.system-info {

    position:
        absolute;

    left:
        24px;

    top:
        26px;

    color:
        rgba(220,215,255,.45);

    font-size:
        9px;

    line-height:
        1.7;

    letter-spacing:
        1.8px;

    text-transform:
        uppercase;

}


.system-info strong {

    color:
        rgba(220,215,255,.78);

}


.coordinates {

    position:
        absolute;

    right:
        24px;

    bottom:
        25px;

    color:
        rgba(220,215,255,.35);

    font-family:
        monospace;

    font-size:
        9px;

    line-height:
        1.8;

    text-align:
        right;

}


/* =========================================================
   MAIN UI
========================================================= */

.page {

    position:
        relative;

    z-index:
        10;

    min-height:
        100dvh;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    padding:
        25px;

}


/* =========================================================
   CARD
========================================================= */

.card {

    position:
        relative;

    width:
        min(455px, 100%);

    padding:
        31px;

    border:
        1px solid
        rgba(170,160,255,.14);

    border-radius:
        25px;

    background:

        linear-gradient(
            145deg,
            rgba(15,14,24,.78),
            rgba(2,2,7,.76)
        );

    backdrop-filter:
        blur(26px);

    -webkit-backdrop-filter:
        blur(26px);

    box-shadow:

        0 40px 120px
        rgba(0,0,0,.72),

        0 0 70px
        rgba(80,70,180,.06),

        inset 0 1px 0
        rgba(255,255,255,.07);

    overflow:
        hidden;

}


.card::before {

    content:
        "";

    position:
        absolute;

    inset:
        0;

    background:

        radial-gradient(
            circle at 100% 0%,
            rgba(130,100,255,.13),
            transparent 34%
        ),

        radial-gradient(
            circle at 0% 100%,
            rgba(70,110,255,.07),
            transparent 35%
        );

    pointer-events:
        none;

}


.card-top-line {

    position:
        absolute;

    left:
        0;

    right:
        0;

    top:
        0;

    height:
        1px;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(150,130,255,.8),
            transparent
        );

}


/* =========================================================
   LOGO
========================================================= */

.logo-row {

    position:
        relative;

    display:
        flex;

    align-items:
        center;

    gap:
        13px;

}


.logo-icon {

    width:
        44px;

    height:
        44px;

    flex-shrink:
        0;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border-radius:
        13px;

    background:

        radial-gradient(
            circle,
            #000 0 30%,
            transparent 32%
        ),

        conic-gradient(
            #5547d8,
            #b866ff,
            #5b91ff,
            #5547d8
        );

    box-shadow:
        0 0 25px
        rgba(110,90,255,.35);

    font-size:
        19px;

}


.logo {

    font-size:
        30px;

    font-weight:
        950;

    letter-spacing:
        -1px;

}


.logo-sub {

    color:
        rgba(255,255,255,.3);

    font-family:
        monospace;

    font-size:
        9px;

    letter-spacing:
        2px;

}


/* =========================================================
   DESCRIPTION
========================================================= */

.subtitle {

    position:
        relative;

    margin:
        14px 0 22px;

    color:
        var(--muted);

    font-size:
        12px;

    line-height:
        1.65;

}


/* =========================================================
   STATUS
========================================================= */

.status {

    display:
        inline-flex;

    align-items:
        center;

    gap:
        8px;

    margin-bottom:
        18px;

    padding:
        7px 10px;

    border:
        1px solid
        rgba(120,110,255,.2);

    border-radius:
        999px;

    background:
        rgba(100,90,255,.07);

    color:
        rgba(215,210,255,.65);

    font-family:
        monospace;

    font-size:
        9px;

    letter-spacing:
        1px;

}


.status-dot {

    width:
        6px;

    height:
        6px;

    border-radius:
        50%;

    background:
        #8c7cff;

    box-shadow:
        0 0 12px
        #8c7cff;

    animation:
        statusBlink 1.8s infinite;

}


@keyframes statusBlink {

    0%,100% {

        opacity:
            .35;

    }

    50% {

        opacity:
            1;

    }

}


/* =========================================================
   LABEL
========================================================= */

label {

    display:
        block;

    margin:
        15px 0 7px;

    color:
        rgba(255,255,255,.58);

    font-family:
        monospace;

    font-size:
        9px;

    font-weight:
        700;

    letter-spacing:
        1.5px;

}


/* =========================================================
   INPUT
========================================================= */

input,
select {

    width:
        100%;

    height:
        47px;

    padding:
        0 13px;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:
        10px;

    outline:
        none;

    background:
        rgba(0,0,0,.35);

    color:
        white;

    font-size:
        13px;

    transition:
        .2s;

}


input::placeholder {

    color:
        rgba(255,255,255,.24);

}


input:focus,
select:focus {

    border-color:
        rgba(130,115,255,.65);

    box-shadow:
        0 0 0 3px
        rgba(110,90,255,.08);

    background:
        rgba(15,13,28,.6);

}


select {

    cursor:
        pointer;

}


/* =========================================================
   CREATE BUTTON
========================================================= */

#create {

    position:
        relative;

    width:
        100%;

    height:
        50px;

    margin-top:
        21px;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:
        11px;

    background:

        linear-gradient(
            110deg,
            #4e43c8,
            #765be0,
            #4e70d0
        );

    color:
        white;

    font-family:
        monospace;

    font-size:
        11px;

    font-weight:
        900;

    letter-spacing:
        1.2px;

    cursor:
        pointer;

    overflow:
        hidden;

    box-shadow:
        0 15px 35px
        rgba(75,65,200,.25);

    transition:
        .18s;

}


#create::before {

    content:
        "";

    position:
        absolute;

    top:
        0;

    bottom:
        0;

    width:
        35%;

    left:
        -40%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.3),
            transparent
        );

    transform:
        skewX(-20deg);

    animation:
        buttonScan 3.5s infinite;

}


@keyframes buttonScan {

    0% {

        left:
            -40%;

    }

    45%,100% {

        left:
            120%;

    }

}


#create:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 18px 45px
        rgba(75,65,220,.35);

}


#create:active {

    transform:
        scale(.985);

}


/* =========================================================
   ERROR
========================================================= */

#error {

    min-height:
        18px;
