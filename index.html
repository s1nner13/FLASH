<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FLASH</title>


    <style>

        /* ==================================================
           GLOBAL
        ================================================== */

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            background: #111214;

            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        button,
        input,
        select {

            font-family: inherit;
        }


        .hidden {

            display: none !important;
        }


        /* ==================================================
           SETUP
        ================================================== */

        #setup {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;
        }


        .setup-box {

            width: 100%;

            max-width: 430px;

            padding: 32px;

            background: #1e1f22;

            border: 1px solid #303238;

            border-radius: 15px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.5);
        }


        .logo {

            font-size: 34px;

            font-weight: 900;

            letter-spacing: 1px;

            margin-bottom: 8px;
        }


        .logo span {

            margin-right: 5px;
        }


        .subtitle {

            color: #aeb1b7;

            margin-top: 0;

            margin-bottom: 30px;
        }


        label {

            display: block;

            margin-top: 18px;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: 700;

            color: #c9cbd0;
        }


        input,
        select {

            width: 100%;

            padding: 13px;

            border-radius: 8px;

            border: 1px solid #3b3d44;

            background: #111214;

            color: white;

            outline: none;

            font-size: 15px;
        }


        input:focus,
        select:focus {

            border-color: #5865f2;
        }


        #createAccount {

            width: 100%;

            margin-top: 25px;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #5865f2;

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;
        }


        #createAccount:hover {

            filter: brightness(1.1);
        }


        #error {

            min-height: 20px;

            color: #ff6b6b;

            font-size: 14px;
        }


        /* ==================================================
           CHAT
        ================================================== */

        #chat {

            height: 100vh;

            display: grid;

            grid-template-rows:
                auto
                1fr
                auto;
        }


        .topbar {

            min-height: 65px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            padding: 12px 18px;

            background: #18191c;

            border-bottom: 1px solid #303238;
        }


        .brand {

            font-size: 20px;

            font-weight: 900;
        }


        .brand span {

            margin-right: 5px;
        }


        .account-info {

            display: flex;

            align-items: center;

            gap: 12px;

            font-size: 13px;
        }


        #userDisplay {

            color: #c9cbd0;
        }


        #timer {

            color: #aeb1b7;
        }


        .delete-btn {

            border: none;

            border-radius: 7px;

            padding: 8px 11px;

            background: #c43d3d;

            color: white;

            font-weight: 700;

            cursor: pointer;
        }


        .delete-btn:hover {

            background: #df4a4a;
        }


        /* ==================================================
           MESSAGES
        ================================================== */

        #messages {

            overflow-y: auto;

            padding: 25px;
        }


        .message {

            margin-bottom: 18px;
        }


        .message-header {

            margin-bottom: 4px;

            font-size: 13px;

            color: #aeb1b7;
        }


        .message-user {

            color: #ffffff;

            font-weight: 700;
        }


        .message-content {

            color: #e5e5e5;

            white-space: pre-wrap;

            overflow-wrap: anywhere;
        }


        /* ==================================================
           MESSAGE INPUT
        ================================================== */

        #messageForm {

            display: flex;

            gap: 10px;

            padding: 14px;

            background: #18191c;

            border-top: 1px solid #303238;
        }


        #messageInput {

            margin: 0;
        }


        #messageForm button {

            width: 55px;

            border: none;

            border-radius: 8px;

            background: #5865f2;

            color: white;

            font-size: 20px;

            cursor: pointer;
        }


        #messageForm button:hover {

            filter: brightness(1.1);
        }


        /* ==================================================
           MOBILE
        ================================================== */

        @media (max-width: 650px) {

            .topbar {

                align-items: flex-start;

                flex-direction: column;
            }


            .account-info {

                width: 100%;

                justify-content: space-between;
            }


            #messages {

                padding: 18px;
            }


            .setup-box {

                padding: 25px;
            }

        }

    </style>

</head>


<body>


    <!-- ==================================================
         CRÉATION DU COMPTE
    ================================================== -->

    <section id="setup">

        <div class="setup-box">

            <div class="logo">

                <span>⚡</span>FLASH

            </div>


            <p class="subtitle">

                Un mini-chat.
                Un compte temporaire.

            </p>


            <label for="username">

                Pseudo

            </label>


            <input
                id="username"
                type="text"
                maxlength="24"
                placeholder="Ton pseudo..."
                autocomplete="off"
            >


            <label for="duration">

                Durée du compte

            </label>


            <select id="duration">

                <option value="3600000">

                    1 heure

                </option>


                <option value="21600000">

                    6 heures

                </option>


                <option
                    value="86400000"
                    selected
                >

                    24 heures

                </option>


                <option value="604800000">

                    7 jours

                </option>


                <option value="2592000000">

                    30 jours

                </option>


                <option value="0">

                    ♾️ Illimitée

                </option>

            </select>


            <button id="createAccount">

                Créer mon compte

            </button>


            <p id="error"></p>

        </div>

    </section>



    <!-- ==================================================
         CHAT
    ================================================== -->

    <section
        id="chat"
        class="hidden"
    >


        <!-- HEADER -->

        <header class="topbar">


            <div class="brand">

                <span>⚡</span>

                FLASH

            </div>


            <div class="account-info">


                <span id="userDisplay"></span>


                <span id="timer"></span>


                <button
                    id="deleteAccount"
                    class="delete-btn"
                >

                    Supprimer

                </button>


            </div>


        </header>



        <!-- MESSAGES -->

        <main id="messages"></main>



        <!-- ENVOI -->

        <form id="messageForm">


            <input
                id="messageInput"
                type="text"
                maxlength="1000"
                placeholder="Écrire un message..."
                autocomplete="off"
            >


            <button type="submit">

                ➤

            </button>


        </form>


    </section>



    <script>

        /* ==================================================
           FLASH V0
        ================================================== */


        const STORAGE_KEY = "FLASH_V0";


        /* ==================================================
           ÉTAT
        ================================================== */


        let state = loadState();



        /* ==================================================
           ELEMENTS
        ================================================== */


        const setup =
            document.getElementById("setup");


        const chat =
            document.getElementById("chat");


        const usernameInput =
            document.getElementById("username");


        const durationInput =
            document.getElementById("duration");


        const createButton =
            document.getElementById("createAccount");


        const userDisplay =
            document.getElementById("userDisplay");


        const timer =
            document.getElementById("timer");


        const messagesContainer =
            document.getElementById("messages");


        const messageForm =
            document.getElementById("messageForm");


        const messageInput =
            document.getElementById("messageInput");


        const deleteButton =
            document.getElementById("deleteAccount");


        const error =
            document.getElementById("error");



        /* ==================================================
           CHARGER LES DONNÉES
        ================================================== */


        function loadState() {

            try {

                const saved =
                    localStorage.getItem(STORAGE_KEY);


                if (!saved) {

                    return {

                        account: null,

                        messages: []

                    };

                }


                return JSON.parse(saved);

            }

            catch {

                return {

                    account: null,

                    messages: []

                };

            }

        }



        /* ==================================================
           SAUVEGARDER
        ================================================== */


        function saveState() {

            localStorage.setItem(

                STORAGE_KEY,

                JSON.stringify(state)

            );

        }



        /* ==================================================
           CRÉER UN COMPTE
        ================================================== */


        function createAccount() {


            const username =
                usernameInput.value.trim();


            const duration =
                Number(durationInput.value);



            if (!username) {

                error.textContent =
                    "Choisis un pseudo.";

                return;

            }



            if (username.length < 2) {

                error.textContent =
                    "Le pseudo doit faire au moins 2 caractères.";

                return;

            }



            state.account = {

                id:
                    crypto.randomUUID(),


                username:
                    username,


                createdAt:
                    Date.now(),


                expiresAt:

                    duration === 0

                        ? 0

                        : Date.now() + duration

            };



            state.messages = [];



            saveState();



            error.textContent = "";



            showChat();

        }



        /* ==================================================
           VÉRIFIER EXPIRATION
        ================================================== */


        function isExpired() {


            if (!state.account) {

                return false;

            }



            if (state.account.expiresAt === 0) {

                return false;

            }



            return (

                Date.now() >=
                state.account.expiresAt

            );

        }



        /* ==================================================
           SUPPRIMER LE COMPTE
        ================================================== */


        function deleteAccount() {


            if (!state.account) {

                return;

            }



            const confirmation = confirm(

                "Supprimer ton compte Flash ?\n\n" +

                "Ton compte et TOUS tes messages " +

                "seront supprimés."

            );



            if (!confirmation) {

                return;

            }



            state.account = null;


            state.messages = [];



            saveState();



            showSetup();

        }



        /* ==================================================
           EXPIRER LE COMPTE
        ================================================== */


        function expireAccount() {


            state.account = null;


            state.messages = [];



            saveState();



            showSetup();

        }



        /* ==================================================
           ENVOYER UN MESSAGE
        ================================================== */


        function sendMessage(text) {


            if (!state.account) {

                return;

            }



            if (isExpired()) {

                expireAccount();

                return;

            }



            state.messages.push({

                id:
                    crypto.randomUUID(),


                username:
                    state.account.username,


                text:
                    text,


                createdAt:
                    Date.now()

            });



            saveState();



            renderMessages();

        }



        /* ==================================================
           AFFICHER LES MESSAGES
        ================================================== */


        function renderMessages() {


            messagesContainer.innerHTML = "";



            for (
                const message
                of state.messages
            ) {


                const element =
                    document.createElement("article");


                element.className =
                    "message";



                const header =
                    document.createElement("div");


                header.className =
                    "message-header";



                const username =
                    document.createElement("span");


                username.className =
                    "message-user";


                username.textContent =
                    "@" + message.username;



                const time =
                    document.createElement("span");


                time.textContent =

                    " · " +

                    new Date(
                        message.createdAt
                    ).toLocaleTimeString(

                        "fr-FR",

                        {

                            hour: "2-digit",

                            minute: "2-digit"

                        }

                    );



                header.appendChild(username);


                header.appendChild(time);



                const content =
                    document.createElement("div");


                content.className =
                    "message-content";


                content.textContent =
                    message.text;



                element.appendChild(header);


                element.appendChild(content);



                messagesContainer.appendChild(element);

            }



            messagesContainer.scrollTop =

                messagesContainer.scrollHeight;

        }



        /* ==================================================
           TIMER
        ================================================== */


        function updateTimer() {


            if (!state.account) {

                return;

            }



            if (state.account.expiresAt === 0) {

                timer.textContent =
                    "♾️ Illimitée";

                return;

            }



            const remaining =

                state.account.expiresAt -

                Date.now();



            if (remaining <= 0) {

                expireAccount();

                return;

            }



            timer.textContent =

                "⏳ " +

                formatDuration(remaining);

        }



        /* ==================================================
           FORMATER LE TEMPS
        ================================================== */


        function formatDuration(ms) {


            let seconds =
                Math.floor(ms / 1000);



            const days =
                Math.floor(
                    seconds / 86400
                );


            seconds %= 86400;



            const hours =
                Math.floor(
                    seconds / 3600
                );


            seconds %= 3600;



            const minutes =
                Math.floor(
                    seconds / 60
                );


            seconds %= 60;



            if (days > 0) {

                return (

                    days +
                    "j " +
                    hours +
                    "h"

                );

            }



            if (hours > 0) {

                return (

                    hours +
                    "h " +
                    minutes +
                    "min"

                );

            }



            if (minutes > 0) {

                return (

                    minutes +
                    "min " +
                    seconds +
                    "s"

                );

            }



            return seconds + "s";

        }



        /* ==================================================
           AFFICHER LE CHAT
        ================================================== */


        function showChat() {


            setup.classList.add("hidden");


            chat.classList.remove("hidden");



            userDisplay.textContent =

                "@" +
                state.account.username;



            renderMessages();


            updateTimer();



            messageInput.focus();

        }



        /* ==================================================
           AFFICHER LA PAGE DE CRÉATION
        ================================================== */


        function showSetup() {


            chat.classList.add("hidden");


            setup.classList.remove("hidden");
