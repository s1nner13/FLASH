<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FLASH</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            background: #111214;

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        .page {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;
        }


        .box {

            width: 100%;

            max-width: 430px;

            padding: 32px;

            background: #1e1f22;

            border: 1px solid #303238;

            border-radius: 16px;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, .5);
        }


        .logo {

            font-size: 36px;

            font-weight: 900;

            letter-spacing: 1px;
        }


        .subtitle {

            color: #aeb1b7;

            margin:
                8px 0 30px;
        }


        label {

            display: block;

            margin:
                18px 0 7px;

            color: #c9cbd0;

            font-size: 14px;

            font-weight: bold;
        }


        input,
        select {

            width: 100%;

            padding: 13px;

            border:
                1px solid #3b3d44;

            border-radius: 8px;

            background: #111214;

            color: white;

            outline: none;

            font-size: 15px;
        }


        input:focus,
        select:focus {

            border-color: #5865f2;
        }


        button {

            border: none;

            border-radius: 8px;

            padding: 13px;

            background: #5865f2;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }


        button:hover {

            filter: brightness(1.1);
        }


        #create {

            width: 100%;

            margin-top: 25px;
        }


        #error {

            min-height: 20px;

            color: #ff6b6b;

            font-size: 14px;
        }

    </style>

</head>


<body>


<div class="page">


    <div class="box">


        <div class="logo">

            ⚡ FLASH

        </div>


        <p class="subtitle">

            Un mini-chat avec des comptes temporaires.

        </p>


        <label for="username">

            Pseudo

        </label>


        <input
            id="username"
            type="text"
            maxlength="24"
            placeholder="Ton pseudo..."
            autocomplete="off"
        >


        <label for="duration">

            Durée du compte

        </label>


        <select id="duration">


            <option value="3600000">

                1 heure

            </option>


            <option value="21600000">

                6 heures

            </option>


            <option
                value="86400000"
                selected
            >

                24 heures

            </option>


            <option value="604800000">

                7 jours

            </option>


            <option value="2592000000">

                30 jours

            </option>


            <option value="0">

                ♾️ Illimitée

            </option>


        </select>


        <button id="create">

            Créer mon compte

        </button>


        <p id="error"></p>


    </div>


</div>



<script>


const STORAGE_KEY = "FLASH_V0";


function generateID() {

    return (

        Date.now() +

        "-" +

        Math.random()
            .toString(36)
            .substring(2)

    );

}


document
    .getElementById("create")
    .addEventListener(
        "click",
        function () {


            const username =

                document
                    .getElementById("username")
                    .value
                    .trim();


            const duration =

                Number(

                    document
                        .getElementById("duration")
                        .value

                );


            const error =

                document
                    .getElementById("error");


            if (!username) {

                error.textContent =
                    "Choisis un pseudo.";

                return;

            }


            if (username.length < 2) {

                error.textContent =
                    "Le pseudo doit contenir au moins 2 caractères.";

                return;

            }


            /*
             * Pour cette V0 locale :
             * ton compte reçoit automatiquement
             * le rôle CREATOR.
             */

            const account = {

                id: generateID(),

                username: username,

                createdAt: Date.now(),

                expiresAt:

                    duration === 0

                        ? 0

                        : Date.now() + duration,


                /*
                 * Badge créateur
                 */

                role: "creator"

            };


            const state = {

                account: account,

                messages: []

            };


            localStorage.setItem(

                STORAGE_KEY,

                JSON.stringify(state)

            );


            /*
             * Redirection vers le chat
             */

            window.location.href =
                "chat.html";

        }

    );

</script>


</body>

</html>
