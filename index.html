<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#020204"
>

<title>FLASH — Enter the void</title>


<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {

    min-height: 100dvh;

    overflow-x: hidden;

    background:
        radial-gradient(
            ellipse at center,
            #11121c 0%,
            #07080d 32%,
            #020204 70%,
            #000000 100%
        );

    color: #fff;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}


/* =========================================================
   SPACE
========================================================= */

.space {

    position: fixed;

    inset: 0;

    overflow: hidden;

    pointer-events: none;

    z-index: 0;
}


/* =========================================================
   STARS
========================================================= */

.stars,
.stars::before,
.stars::after {

    position: absolute;

    inset: -50%;

    content: "";

    background-image:

        radial-gradient(
            circle,
            rgba(255,255,255,.8) 0 1px,
            transparent 1.5px
        ),

        radial-gradient(
            circle,
            rgba(180,190,255,.55) 0 1px,
            transparent 1.5px
        );

    background-size:
        140px 140px,
        230px 230px;

    animation:
        starsMove 90s linear infinite;
}

.stars::before {

    transform:
        scale(1.4)
        rotate(12deg);

    opacity: .35;

    animation-duration: 150s;
}

.stars::after {

    transform:
        scale(1.8)
        rotate(-18deg);

    opacity: .2;

    animation-duration: 220s;
}


@keyframes starsMove {

    from {
        transform:
            translate3d(0,0,0);
    }

    to {
        transform:
            translate3d(180px,100px,0);
    }

}


/* =========================================================
   DISTANT NEBULA
========================================================= */

.nebula {

    position: absolute;

    width: 80vw;
    height: 80vw;

    max-width: 1000px;
    max-height: 1000px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%,-50%);

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            rgba(120,80,255,.16),
            transparent 34%
        ),

        radial-gradient(
            circle at 70% 30%,
            rgba(40,130,255,.10),
            transparent 30%
        ),

        radial-gradient(
            circle at 30% 70%,
            rgba(180,40,255,.08),
            transparent 30%
        );

    filter:
        blur(50px);

    animation:
        nebulaPulse 9s ease-in-out infinite alternate;
}


@keyframes nebulaPulse {

    from {
        transform:
            translate(-50%,-50%)
            scale(.92);
        opacity: .7;
    }

    to {
        transform:
            translate(-50%,-50%)
            scale(1.08);
        opacity: 1;
    }

}


/* =========================================================
   BLACK HOLE
========================================================= */

.black-hole {

    position: absolute;

    left: 50%;
    top: 50%;

    width: min(42vw, 480px);
    aspect-ratio: 1;

    transform:
        translate(-50%,-50%);

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            #000 0 32%,
            rgba(0,0,0,.98) 42%,
            rgba(0,0,0,0) 67%
        );

    box-shadow:

        0 0 50px
            rgba(130,100,255,.16),

        0 0 110px
            rgba(70,100,255,.09);

    z-index: 1;
}


/* =========================================================
   ACCRETION DISK
========================================================= */

.disk {

    position: absolute;

    left: 50%;
    top: 50%;

    width: min(65vw, 720px);
    aspect-ratio: 1;

    transform:
        translate(-50%,-50%)
        rotateX(68deg)
        rotate(-18deg);

    border-radius: 50%;

    background:

        conic-gradient(

            from 0deg,

            transparent 0deg,

            rgba(90,70,255,.15) 35deg,

            rgba(170,100,255,.65) 70deg,

            rgba(255,210,130,.9) 110deg,

            rgba(120,90,255,.45) 150deg,

            transparent 205deg,

            rgba(60,100,255,.25) 250deg,

            rgba(190,100,255,.7) 300deg,

            transparent 360deg
        );

    filter:
        blur(7px);

    opacity: .9;

    animation:
        diskSpin 18s linear infinite;

    z-index: 2;
}


.disk::before {

    content: "";

    position: absolute;

    inset: 9%;

    border-radius: 50%;

    border:
        10px solid
        rgba(255,255,255,.12);

    filter:
        blur(8px);
}


.disk::after {

    content: "";

    position: absolute;

    inset: 20%;

    border-radius: 50%;

    background:
        #000;

    box-shadow:
        0 0 30px #000;

}


@keyframes diskSpin {

    from {
        transform:
            translate(-50%,-50%)
            rotateX(68deg)
            rotate(-18deg);
    }

    to {
        transform:
            translate(-50%,-50%)
            rotateX(68deg)
            rotate(342deg);
    }

}


/* =========================================================
   GRAVITATIONAL LENS
========================================================= */

.lens {

    position: absolute;

    left: 50%;
    top: 50%;

    width: min(48vw, 560px);
    aspect-ratio: 1;

    transform:
        translate(-50%,-50%);

    border-radius: 50%;

    border:
        1px solid
        rgba(180,160,255,.18);

    box-shadow:

        inset 0 0 40px
            rgba(100,80,255,.12),

        0 0 40px
            rgba(120,100,255,.08);

    z-index: 3;

    animation:
        lensPulse 5s ease-in-out infinite alternate;
}


@keyframes lensPulse {

    from {
        opacity: .45;
        transform:
            translate(-50%,-50%)
            scale(.97);
    }

    to {
        opacity: .8;
        transform:
            translate(-50%,-50%)
            scale(1.03);
    }

}


/* =========================================================
   UI
========================================================= */

.page {

    position: relative;

    z-index: 10;

    min-height: 100dvh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 30px 18px;
}


.card {

    position: relative;

    width: min(460px, 100%);

    padding: 34px;

    border:
        1px solid
        rgba(255,255,255,.10);

    border-radius: 26px;

    background:
        linear-gradient(
            145deg,
            rgba(20,20,29,.72),
            rgba(5,5,9,.80)
        );

    backdrop-filter:
        blur(24px);

    -webkit-backdrop-filter:
        blur(24px);

    box-shadow:

        0 30px 100px
            rgba(0,0,0,.65),

        inset 0 1px 0
            rgba(255,255,255,.08);

    overflow: hidden;
}


.card::before {

    content: "";

    position: absolute;

    width: 250px;
    height: 250px;

    top: -160px;
    right: -120px;

    border-radius: 50%;

    background:
        rgba(110,80,255,.18);

    filter:
        blur(45px);
}


.card::after {

    content: "";

    position: absolute;

    width: 200px;
    height: 200px;

    bottom: -140px;
    left: -100px;

    border-radius: 50%;

    background:
        rgba(30,100,255,.12);

    filter:
        blur(45px);
}


/* =========================================================
   LOGO
========================================================= */

.logo-row {

    display: flex;

    align-items: center;

    gap: 13px;

    margin-bottom: 8px;
}


.logo-icon {

    width: 45px;
    height: 45px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 14px;

    background:

        radial-gradient(
            circle,
            #000 0 32%,
            transparent 34%
        ),

        conic-gradient(
            #705cff,
            #b45cff,
            #4f8cff,
            #705cff
        );

    box-shadow:
        0 0 25px
        rgba(110,90,255,.35);

    font-size: 20px;
}


.logo {

    font-size: 31px;

    font-weight: 950;

    letter-spacing: -.8px;
}


.subtitle {

    margin:
        0 0 28px;

    color:
        rgba(255,255,255,.52);

    font-size: 13px;

    line-height: 1.5;
}


/* =========================================================
   STATUS
========================================================= */

.status {

    display: inline-flex;

    align-items: center;

    gap: 7px;

    margin-bottom: 22px;

    padding:
        7px 10px;

    border:
        1px solid
        rgba(120,110,255,.20);

    border-radius: 999px;

    background:
        rgba(100,90,255,.08);

    color:
        rgba(210,205,255,.85);

    font-size: 11px;

    letter-spacing: .3px;
}


.status-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #8c7cff;

    box-shadow:
        0 0 12px
        #8c7cff;

    animation:
        statusPulse 2s infinite;
}


@keyframes statusPulse {

    0%,100% {
        opacity: .45;
        transform: scale(.8);
    }

    50% {
        opacity: 1;
        transform: scale(1);
    }

}


/* =========================================================
   FORM
========================================================= */

label {

    display: block;

    margin:
        17px 0 8px;

    color:
        rgba(255,255,255,.72);

    font-size: 12px;

    font-weight: 750;

    letter-spacing: .2px;
}


.input-wrap {

    position: relative;
}


input,
select {

    width: 100%;

    height: 48px;

    padding:
        0 14px;

    border:
        1px solid
        rgba(255,255,255,.09);

    border-radius: 11px;

    outline: none;

    background:
        rgba(0,0,0,.32);

    color: white;

    font-size: 14px;

    transition:
        border .2s,
        box-shadow .2s,
        background .2s;
}


input::placeholder {

    color:
        rgba(255,255,255,.28);
}


input:focus,
select:focus {

    border-color:
        rgba(125,110,255,.75);

    background:
        rgba(20,18,35,.55);

    box-shadow:
        0 0 0 3px
        rgba(110,90,255,.10);
}


select {

    appearance: none;

    cursor: pointer;

    background-image:

        linear-gradient(45deg,
            transparent 50%,
            #aaa 50%
        ),

        linear-gradient(135deg,
            #aaa 50%,
            transparent 50%
        );

    background-position:

        calc(100% - 17px) 20px,
        calc(100% - 12px) 20px;

    background-size:
        5px 5px,
        5px 5px;

    background-repeat:
        no-repeat;
}


/* =========================================================
   BUTTON
========================================================= */

#create {

    position: relative;

    width: 100%;

    height: 51px;

    margin-top: 25px;

    border: 0;

    border-radius: 12px;

    background:

        linear-gradient(
            110deg,
            #5545dc,
            #785ce8,
            #4b72db
        );

    color: white;

    font-size: 14px;

    font-weight: 850;

    letter-spacing: .2px;

    cursor: pointer;

    overflow: hidden;

    box-shadow:

        0 12px 30px
        rgba(85,70,220,.25);

    transition:
        transform .15s,
        box-shadow .15s;
}


#create::before {

    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            110deg,
            transparent,
            rgba(255,255,255,.18),
            transparent
        );

    transform:
        translateX(-100%);

    transition:
        transform .5s;
}


#create:hover {

    transform:
        translateY(-2px);

    box-shadow:

        0 16px 40px
        rgba(85,70,220,.34);
}


#create:hover::before {

    transform:
        translateX(100%);
}


#create:active {

    transform:
        translateY(1px)
        scale(.99);
}


/* =========================================================
   ERROR
========================================================= */

#error {

    min-height: 19px;

    margin:
        10px 0 0;

    color:
        #ff7070;

    font-size: 12px;

    text-align: center;
}


/* =========================================================
   FOOTER
========================================================= */

.footer {

    margin-top: 24px;

    padding-top: 17px;

    border-top:
        1px solid
        rgba(255,255,255,.06);

    color:
        rgba(255,255,255,.27);

    font-size: 10px;

    line-height: 1.6;

    text-align: center;
}


.footer strong {

    color:
        rgba(255,255,255,.5);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 600px) {

    .page {

        padding:
            18px 13px;
    }


    .card {

        padding:
            25px 20px;

        border-radius: 21px;
    }


    .logo {

        font-size: 27px;
    }


    .logo-icon {

        width: 41px;
        height: 41px;

        border-radius: 12px;
    }


    .black-hole {

        width: 95vw;
    }


    .disk {

        width: 135vw;
    }


    .lens {

        width: 105vw;
    }

}


@media (max-height: 700px) {

    .page {

        align-items: flex-start;

        padding-top: 18px;
        padding-bottom: 18px;
    }


    .card {

        padding:
            21px 19px;
    }


    .subtitle {

        margin-bottom: 17px;
    }


    label {

        margin-top: 12px;
    }


    #create {

        margin-top: 18px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     SPACE BACKGROUND
====================================================== -->

<div class="space">

    <div class="stars"></div>

    <div class="nebula"></div>

    <div class="disk"></div>

    <div class="black-hole"></div>

    <div class="lens"></div>

</div>


<!-- =====================================================
     MAIN
====================================================== -->

<main class="page">


    <section class="card">


        <div class="logo-row">

            <div class="logo-icon">
                ⚡
            </div>

            <div class="logo">
                FLASH
            </div>

        </div>


        <p class="subtitle">

            Enter the void.
            <br>
            Crée ton identité. Disparais quand le temps est écoulé.

        </p>


        <div class="status">

            <span class="status-dot"></span>

            SYSTEM ONLINE

        </div>


        <!-- PSEUDO -->

        <label for="username">

            IDENTITÉ

        </label>


        <div class="input-wrap">

            <input
                id="username"
                type="text"
                maxlength="24"
                placeholder="Choisis ton pseudo..."
                autocomplete="off"
                spellcheck="false"
            >

        </div>


        <!-- DURÉE -->

        <label for="duration">

            DURÉE DU COMPTE

        </label>


        <select id="duration">


            <option value="3600000">

                1 heure

            </option>


            <option value="21600000">

                6 heures

            </option>


            <option
                value="86400000"
                selected
            >

                24 heures

            </option>


            <option value="604800000">

                7 jours

            </option>


            <option value="2592000000">

                30 jours

            </option>


            <option value="0">

                ♾️ Illimitée

            </option>


        </select>


        <!-- CREATE -->

        <button id="create">

            CRÉER MON COMPTE

        </button>


        <p id="error"></p>


        <div class="footer">

            <strong>FLASH V0</strong>
            · Compte local temporaire
            · Données stockées sur cet appareil

        </div>


    </section>


</main>



<script>

/* =========================================================
   FLASH — ACCOUNT CREATION
========================================================= */

const STORAGE_KEY = "FLASH_V0";


function generateID() {

    return (

        Date.now() +

        "-" +

        Math.random()
            .toString(36)
            .substring(2)

    );

}


document
    .getElementById("create")
    .addEventListener(
        "click",
        function() {


            const username =

                document
                    .getElementById("username")
                    .value
                    .trim();


            const duration =

                Number(

                    document
                        .getElementById("duration")
                        .value

                );


            const error =

                document
                    .getElementById("error");


            /* =========================
               VALIDATION
            ========================= */


            if (!username) {

                error.textContent =
                    "Choisis un pseudo.";

                return;

            }


            if (username.length < 2) {

                error.textContent =
                    "Le pseudo doit contenir au moins 2 caractères.";

                return;

            }


            if (
                !/^[a-zA-Z0-9_.-]+$/.test(
                    username
                )
            ) {

                error.textContent =
                    "Utilise uniquement lettres, chiffres, _, - ou .";

                return;

            }


            /* =========================
               CREATE ACCOUNT
            ========================= */


            const account = {

                id:
                    generateID(),

                username:
                    username,

                createdAt:
                    Date.now(),

                expiresAt:

                    duration === 0

                        ? 0

                        : Date.now() + duration,


                /*
                 * V0 LOCALE
                 *
                 * Le compte créé depuis
                 * cette page reçoit le rôle
                 * creator.
                 *
                 * À remplacer par une
                 * vérification serveur
                 * dans une future version.
                 */

                role:
                    "creator",

                avatar:
                    null

            };


            const state = {

                account:
                    account,

                messages:
                    []

            };


            localStorage.setItem(

                STORAGE_KEY,

                JSON.stringify(state)

            );


            /*
             * Entrée dans le chat
             */

            window.location.href =
                "chat.html";

        }
    );


/* =========================================================
   ENTER KEY
========================================================= */

document
    .getElementById("username")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                document
                    .getElementById("create")
                    .click();

            }

        }
    );

</script>


</body>

    </html>
