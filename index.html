<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FLASH</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #050509;
    color: white;

    font-family: Arial, sans-serif;
}

.card {
    width: min(420px, 90%);
    padding: 30px;

    background: #101018;

    border: 1px solid #292943;
    border-radius: 20px;

    box-shadow:
        0 0 50px rgba(80,60,255,.15);

    text-align: center;
}

h1 {
    margin-top: 0;

    font-size: 40px;
}

p {
    color: #9999aa;
}

input,
select,
button {

    width: 100%;

    height: 48px;

    margin-top: 10px;

    border-radius: 10px;

    border: 1px solid #292943;

    padding: 0 12px;

    font-size: 14px;
}

input,
select {

    background: #07070b;

    color: white;

}

button {

    background: #6355df;

    color: white;

    font-weight: bold;

    cursor: pointer;
}

button:hover {

    background: #7568ef;

}

#existing {

    display: none;

    margin-top: 10px;

    background: #181826;
}

#error {

    color: #ff6666;

    min-height: 20px;
}

</style>
</head>

<body>

<div class="card">

    <h1>⚡ FLASH</h1>

    <p>
        Temporary social network
    </p>


    <input
        id="username"
        type="text"
        placeholder="Ton pseudo"
        maxlength="24"
    >


    <select id="duration">

        <option value="3600000">
            1 heure
        </option>

        <option value="21600000">
            6 heures
        </option>

        <option value="86400000">
            24 heures
        </option>

        <option value="604800000">
            7 jours
        </option>

        <option value="2592000000">
            30 jours
        </option>

        <option value="0">
            ∞ Illimité
        </option>

    </select>


    <button id="create">
        CRÉER MON COMPTE
    </button>


    <button id="existing">
        ACCÉDER AU CHAT
    </button>


    <p id="error"></p>

</div>


<script>

const STORAGE_KEY = "FLASH_V0";


const username =
    document.getElementById("username");


const duration =
    document.getElementById("duration");


const create =
    document.getElementById("create");


const existing =
    document.getElementById("existing");


const error =
    document.getElementById("error");


function getAccount() {

    const data =
        localStorage.getItem(STORAGE_KEY);

    if (!data) {
        return null;
    }

    try {

        const state =
            JSON.parse(data);

        return state.account || null;

    } catch {

        return null;

    }

}


function isExpired(account) {

    if (!account) {
        return true;
    }

    if (account.expiresAt === 0) {
        return false;
    }

    return Date.now() >= account.expiresAt;

}


function refresh() {

    const account =
        getAccount();


    if (!account) {

        existing.style.display =
            "none";

        return;

    }


    if (isExpired(account)) {

        localStorage.removeItem(
            STORAGE_KEY
        );

        existing.style.display =
            "none";

        return;

    }


    existing.style.display =
        "block";

}


create.addEventListener(
    "click",
    function() {

        error.textContent = "";


        const name =
            username.value.trim();


        if (!name) {

            error.textContent =
                "Entre un pseudo.";

            return;

        }


        if (name.length < 2) {

            error.textContent =
                "Le pseudo doit avoir au moins 2 caractères.";

            return;

        }


        const selectedDuration =
            Number(duration.value);


        const account = {

            id:
                Date.now().toString(36) +
                Math.random()
                    .toString(36)
                    .slice(2),

            username:
                name,

            createdAt:
                Date.now(),

            expiresAt:

                selectedDuration === 0

                    ? 0

                    : Date.now() +
                      selectedDuration

        };


        const state = {

            account:
                account,

            messages:
                [],

            channels:
                []

        };


        try {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(state)
            );

        } catch {

            error.textContent =
                "Impossible d'utiliser le stockage local.";

            return;

        }


        window.location.href =
            "chat.html";

    }
);


existing.addEventListener(
    "click",
    function() {

        window.location.href =
            "chat.html";

    }
);


refresh();

</script>

</body>
</html>
